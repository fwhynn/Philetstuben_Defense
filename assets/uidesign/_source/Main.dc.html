<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Hauptmenü – Hex-Blüte Desktop</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,900&amp;family=Barlow+Semi+Condensed:wght@600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#bfd0c6}a:hover{color:#ffe198}
button{font:inherit;color:inherit}
</style>
</helmet>
<div style="position: relative; width: 1440px; height: 900px; overflow: hidden; background: #0a100c; font-family: 'Barlow Semi Condensed', 'Arial Narrow', system-ui, sans-serif; color: #f6f2e4">
  <div style="position: absolute; left: 0; top: 0">
    <dc-import name="Backdrop" w="{{ 1440 }}" h="{{ 900 }}" hint-size="1440px,900px"></dc-import>
  </div>

  <header style="position: absolute; left: 400px; top: 28px; width: 640px; display: flex; justify-content: center">
    <h1 style="margin: 0; line-height: 0">
      <dc-import name="Wordmark" variant="full" width="{{ 640 }}" hint-size="640px,143px"></dc-import>
    </h1>
  </header>

  <div aria-hidden="true" style="position: absolute; left: 470px; top: 218px; width: 500px; height: 500px; border-radius: 50%; background: radial-gradient(closest-side, rgba(246, 201, 90, 0.16), rgba(246, 201, 90, 0))"></div>

  <nav aria-label="Hauptmenü" style="position: absolute; inset: 0; pointer-events: none">
    <button aria-label="Arsenal, Upgrade verfügbar" style="position: absolute; left: 533px; top: 195px; padding: 0; border: 0; background: none; pointer-events: auto; cursor: pointer">
      <dc-import name="Hex" family="green" h="{{ 200 }}" icon="arsenal" label="Arsenal" sub="" badge="upgrade" hint-size="173px,200px"></dc-import>
    </button>
    <button style="position: absolute; left: 733px; top: 195px; padding: 0; border: 0; background: none; pointer-events: auto; cursor: pointer">
      <dc-import name="Hex" family="green" h="{{ 200 }}" icon="leaderboard" label="Bestenliste" sub="" hint-size="173px,200px"></dc-import>
    </button>
    <button style="position: absolute; left: 833px; top: 368px; padding: 0; border: 0; background: none; pointer-events: auto; cursor: pointer">
      <dc-import name="Hex" family="green" h="{{ 200 }}" icon="settings" label="Einstellungen" sub="" hint-size="173px,200px"></dc-import>
    </button>
    <button style="position: absolute; left: 733px; top: 541px; padding: 0; border: 0; background: none; pointer-events: auto; cursor: pointer">
      <dc-import name="Hex" family="green" h="{{ 200 }}" icon="duo" label="Duo" sub="" hint-size="173px,200px"></dc-import>
    </button>
    <button style="position: absolute; left: 533px; top: 541px; padding: 0; border: 0; background: none; pointer-events: auto; cursor: pointer">
      <dc-import name="Hex" family="green" h="{{ 200 }}" icon="daily" label="Tägliche Heraus&shy;forderung" sub="" hint-size="173px,200px"></dc-import>
    </button>
    <button style="position: absolute; left: 433px; top: 368px; padding: 0; border: 0; background: none; pointer-events: auto; cursor: pointer">
      <dc-import name="Hex" family="green" h="{{ 200 }}" icon="account" label="Account" sub="" hint-size="173px,200px"></dc-import>
    </button>
    <button style="position: absolute; left: 625px; top: 358px; padding: 0; border: 0; background: none; pointer-events: auto; cursor: pointer">
      <dc-import name="Hex" family="gold" h="{{ 220 }}" emph="{{ true }}" icon="play" label="Spielen" sub="Fortsetzen · Welle 20" hint-size="191px,220px"></dc-import>
    </button>
    <button style="position: absolute; left: 50%; top: 762px; transform: translateX(-50%); display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 20px 0 14px; border-radius: 999px; border: 2px solid #b8a274; background: linear-gradient(180deg, #fffaf0, #f1e6c6 60%, #dfcd9f); color: #2b281f; font-size: 17px; font-weight: 700; box-shadow: inset 0 2px 0 rgba(255, 255, 255, 0.7), 0 3px 0 #7b6c49, 0 8px 14px rgba(0, 0, 0, 0.45); pointer-events: auto; cursor: pointer">
      <dc-import name="Icon" glyph="newRun" size="{{ 20 }}" fill="currentColor" hint-size="20px,20px"></dc-import>Neuer Run
    </button>
  </nav>

  <footer style="position: absolute; left: 32px; right: 32px; bottom: 22px; display: flex; align-items: center; justify-content: space-between; gap: 16px">
    <label style="display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 14px; border-radius: 999px; border: 1px solid rgba(93, 125, 99, 0.6); background: rgba(15, 26, 20, 0.8); font-size: 16px; font-weight: 600; cursor: pointer">
      <dc-import name="Icon" glyph="language" size="{{ 20 }}" fill="#bfd0c6" hint-size="20px,20px"></dc-import>
      <span>Deutsch</span>
      <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M6 9l6 6 6-6" fill="none" stroke="#bfd0c6" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"></path></svg>
    </label>
    <nav aria-label="Rechtliches" style="display: flex; gap: 8px; font-size: 14px; font-weight: 600; color: #8fa092">
      <a href="#">Impressum</a><span aria-hidden="true">·</span><a href="#">Datenschutz</a>
    </nav>
    <div style="display: flex; align-items: center; gap: 12px">
      <span style="font-size: 14px; font-weight: 600; color: #8fa092">v1.1.0</span>
      <button style="display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid rgba(93, 125, 99, 0.6); background: rgba(15, 26, 20, 0.8); font-size: 16px; font-weight: 600; cursor: pointer">
        <dc-import name="Icon" glyph="patchNotes" size="{{ 20 }}" fill="#bfd0c6" hint-size="20px,20px"></dc-import>Patch Notes
      </button>
    </div>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
