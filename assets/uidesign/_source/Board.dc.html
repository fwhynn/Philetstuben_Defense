<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Spielfeld</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,900&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div aria-hidden="true" style="position: relative; width: {{w}}px; height: {{h}}px; overflow: hidden; background: radial-gradient(ellipse 80% 75% at 50% 45%, #8fd3f4 0%, #63b7e6 55%, #3f97cf 100%)">
  <svg viewBox="0 0 {{w}} {{h}}" width="{{w}}" height="{{h}}" style="position: absolute; left: 0; top: 0">
    <defs>
      <radialGradient id="bd-glow" cx="0.5" cy="0.5" r="0.5">
        <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"></stop>
        <stop offset="1" stop-color="#ffffff" stop-opacity="0"></stop>
      </radialGradient>
    </defs>
    <path d="{{waves}}" fill="none" stroke="#ffffff" stroke-opacity="0.28" stroke-width="{{waveW}}" stroke-linecap="round"></path>
    <path d="{{shadowD}}" fill="#1f5f8c" opacity="0.35"></path>
    <path d="{{isleSide}}" fill="#b9b4a8"></path>
    <path d="{{isleTop}}" fill="#8d9389"></path>
    <path d="{{isleTop2}}" fill="#a3a99e"></path>
    <path d="{{sideL}}" fill="#c9a26b"></path>
    <path d="{{sideR}}" fill="#e2c08a"></path>
    <path d="{{rockBand}}" fill="#d9d4c8"></path>
    <path d="{{fogSide}}" fill="#6e746c"></path>
    <path d="{{fogTop}}" fill="#80867e"></path>
    <path d="{{fogTop2}}" fill="#959b92"></path>
    <path d="{{plainA}}" fill="#6fae55"></path>
    <path d="{{plainB}}" fill="#649f4c"></path>
    <path d="{{sandA}}" fill="#ead69e"></path>
    <path d="{{sandB}}" fill="#ddc78c"></path>
    <path d="{{meadowA}}" fill="#a6d46a"></path>
    <path d="{{meadowB}}" fill="#98c95e"></path>
    <path d="{{edge}}" fill="none" stroke="#5f8f3c" stroke-opacity="0.45" stroke-width="1.2"></path>
    <path d="{{road}}" fill="none" stroke="#c9995a" stroke-width="{{roadW1}}" stroke-linecap="round" stroke-linejoin="round"></path>
    <path d="{{road}}" fill="none" stroke="#efd49e" stroke-width="{{roadW2}}" stroke-linecap="round" stroke-linejoin="round"></path>
    <path d="{{range}}" fill="url(#bd-glow)" stroke="#ffffff" stroke-opacity="0.75" stroke-width="2"></path>
    <path d="{{selHex}}" fill="rgba(255, 214, 90, 0.22)" stroke="#ffd04a" stroke-width="{{selW}}" stroke-linejoin="round"></path>
    <path d="{{flowers}}" fill="#fff6d0"></path>
    <path d="{{bodyShadow}}" fill="#2f4a26" opacity="0.35"></path>
    <path d="{{wall}}" fill="#a8a294"></path>
    <path d="{{wallTop}}" fill="#c9c3b4"></path>
    <path d="{{court}}" fill="#d9c08a"></path>
    <path d="{{stoneBody}}" fill="#8c877c"></path>
    <path d="{{woodBody}}" fill="#9a6a3a"></path>
    <path d="{{woodTop}}" fill="#c08850"></path>
    <path d="{{iceBody}}" fill="#7fd3f0"></path>
    <path d="{{iceTop}}" fill="#d8f6ff"></path>
    <path d="{{fire}}" fill="#ff8a2a"></path>
    <path d="{{orb}}" fill="#8fd0ff"></path>
    <path d="{{roofRed}}" fill="#d0413a"></path>
    <path d="{{roofRedLit}}" fill="#e8605a"></path>
    <path d="{{houseWall}}" fill="#f1e6c6"></path>
    <path d="{{flags}}" fill="#ffffff"></path>
    <path d="{{treeDark}}" fill="#2f6a3a"></path>
    <path d="{{treeLit}}" fill="#4c9145"></path>
    <path d="{{spawn}}" fill="none" stroke="#7a2fb8" stroke-width="{{selW}}"></path>
    <text x="{{q0.x}}" y="{{q0.y}}" text-anchor="middle" font-family="Fraunces, Georgia, serif" font-weight="900" font-size="{{qFs}}" fill="#f4f4ee" stroke="#5a605a" stroke-width="{{qStroke}}" paint-order="stroke">?</text>
    <text x="{{q1.x}}" y="{{q1.y}}" text-anchor="middle" font-family="Fraunces, Georgia, serif" font-weight="900" font-size="{{qFs}}" fill="#f4f4ee" stroke="#5a605a" stroke-width="{{qStroke}}" paint-order="stroke">?</text>
    <text x="{{q2.x}}" y="{{q2.y}}" text-anchor="middle" font-family="Fraunces, Georgia, serif" font-weight="900" font-size="{{qFs}}" fill="#f4f4ee" stroke="#5a605a" stroke-width="{{qStroke}}" paint-order="stroke">?</text>
    <text x="{{q3.x}}" y="{{q3.y}}" text-anchor="middle" font-family="Fraunces, Georgia, serif" font-weight="900" font-size="{{qFs}}" fill="#f4f4ee" stroke="#5a605a" stroke-width="{{qStroke}}" paint-order="stroke">?</text>
    <text x="{{q4.x}}" y="{{q4.y}}" text-anchor="middle" font-family="Fraunces, Georgia, serif" font-weight="900" font-size="{{qFs}}" fill="#f4f4ee" stroke="#5a605a" stroke-width="{{qStroke}}" paint-order="stroke">?</text>
    <text x="{{q5.x}}" y="{{q5.y}}" text-anchor="middle" font-family="Fraunces, Georgia, serif" font-weight="900" font-size="{{qFs}}" fill="#f4f4ee" stroke="#5a605a" stroke-width="{{qStroke}}" paint-order="stroke">?</text>
  </svg>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"w":{"editor":"int","default":1200,"min":200,"max":2400},"h":{"editor":"int","default":760,"min":200,"max":1600},"r":{"editor":"int","default":56,"min":12,"max":120},"cx":{"editor":"int","default":600},"cy":{"editor":"int","default":380},"selTower":{"editor":"boolean","default":false},"$preview":{"width":1200,"height":760}}'>
class Component extends DCLogic {
  renderVals() {
    const w = this.props.w ?? 1200, h = this.props.h ?? 760, R = this.props.r ?? 56;
    const CX = this.props.cx ?? w / 2, CY = this.props.cy ?? h / 2;
    const sel = !!this.props.selTower;
    // Schrägsicht: Höhe auf 66 % gestaucht, Kachelseiten 30 % des Radius.
    const k = 0.66, sd = R * 0.3, s = 0.965;
    const f = (n) => Math.round(n * 10) / 10;
    const P = (pts) => 'M' + pts.map((p) => f(p[0]) + ' ' + f(p[1])).join('L') + 'Z';
    const E = (x, y, rx, ry) => 'M' + f(x - rx) + ' ' + f(y) + 'a' + f(rx) + ' ' + f(ry) + ' 0 1 0 ' + f(2 * rx) + ' 0a' + f(rx) + ' ' + f(ry) + ' 0 1 0 ' + f(-2 * rx) + ' 0Z';
    const px = (q, r) => [CX + R * Math.sqrt(3) * (q + r / 2), CY + R * 1.5 * r * k];
    const dist = (q, r) => Math.max(Math.abs(q), Math.abs(r), Math.abs(q + r));
    const key = (q, r) => q + ',' + r;
    let seed = 5;
    const rnd = () => { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };
    const hexPts = (x, y, sc, rad) => {
      const rr = (rad || R) * sc;
      return [[x, y - rr * k], [x + 0.866 * rr, y - 0.5 * rr * k], [x + 0.866 * rr, y + 0.5 * rr * k], [x, y + rr * k], [x - 0.866 * rr, y + 0.5 * rr * k], [x - 0.866 * rr, y - 0.5 * rr * k]];
    };
    const roads = [
      [[0,0],[1,-1],[2,-2],[2,-3],[3,-4],[3.5,-4.5]],
      [[0,0],[-1,1],[-2,1],[-3,2],[-3,3],[-4,4],[-4.5,4.5]],
      [[0,0],[1,0],[2,0],[2,1],[3,1],[4,0],[4.5,-0.5]]
    ];
    const roadSet = new Set();
    roads.forEach((rd) => rd.forEach(([q, r]) => { if (Number.isInteger(q)) roadSet.add(key(q, r)); }));
    const towers = { '-1,0': 'archer', '1,1': 'catapult', '0,-2': 'freeze', '-2,2': 'chain', '2,-1': 'flame' };
    const houses = new Set(['0,1', '-1,-1', '1,-2', '-2,0']);
    const g = { sideL: '', sideR: '', rockBand: '', shadowD: '', meadowA: '', meadowB: '', plainA: '', plainB: '', sandA: '', sandB: '', edge: '', flowers: '', treeDark: '', treeLit: '' };
    const trees = [];
    const tiles = [];
    for (let r = -4; r <= 4; r++) {
      for (let q = -4; q <= 4; q++) {
        const d = dist(q, r);
        if (d > 4) continue;
        const kk = key(q, r);
        let type = 'meadow';
        if (d >= 3 && !roadSet.has(kk)) {
          const hsh = ((q * 7 + r * 13) % 5 + 5) % 5;
          if (d === 4 && hsh < 2) continue;
          type = (q >= 1 && r >= 0) || (q >= 2 && r >= -1) ? 'sand' : 'plain';
          if (d === 3 && hsh === 4) type = 'meadow';
        }
        tiles.push({ q, r, type, kk });
      }
    }
    tiles.sort((a, b) => a.r - b.r);
    tiles.forEach(({ q, r, type, kk }) => {
      const [x, y] = px(q, r);
      const t = hexPts(x, y, s);
      const L = t[4], M = t[3], Rr = t[2];
      g.sideL += P([L, M, [M[0], M[1] + sd], [L[0], L[1] + sd]]);
      g.sideR += P([M, Rr, [Rr[0], Rr[1] + sd], [M[0], M[1] + sd]]);
      g.rockBand += P([[L[0], L[1] + sd * 0.62], [M[0], M[1] + sd * 0.62], [M[0], M[1] + sd], [L[0], L[1] + sd]]) + P([[M[0], M[1] + sd * 0.62], [Rr[0], Rr[1] + sd * 0.62], [Rr[0], Rr[1] + sd], [M[0], M[1] + sd]]);
      g.shadowD += P(hexPts(x + R * 0.12, y + sd + R * 0.18, s * 1.02));
      const pre = type === 'meadow' ? 'meadow' : type === 'sand' ? 'sand' : 'plain';
      for (let i = 0; i < 6; i++) {
        const tri = P([[x, y], t[i], t[(i + 1) % 6]]);
        if (i % 2) g[pre + 'B'] += tri; else g[pre + 'A'] += tri;
      }
      g.edge += P(t);
      if (type === 'meadow' && !roadSet.has(kk) && !towers[kk] && !houses.has(kk) && kk !== '0,0') {
        const n = 3 + Math.floor(rnd() * 3);
        for (let i = 0; i < n; i++) {
          const a = rnd() * Math.PI * 2, rr = R * (0.15 + rnd() * 0.5);
          trees.push([x + Math.cos(a) * rr, y + Math.sin(a) * rr * k, R * (0.28 + rnd() * 0.16)]);
        }
        g.flowers += E(x + R * 0.3, y + R * 0.2 * k, R * 0.03, R * 0.02) + E(x - R * 0.35, y - R * 0.1 * k, R * 0.03, R * 0.02);
      }
      if (type === 'plain' && rnd() < 0.35) trees.push([x + (rnd() - 0.5) * R * 0.6, y + (rnd() - 0.5) * R * 0.4 * k, R * 0.3]);
      if ((roadSet.has(kk) || towers[kk] || houses.has(kk)) && kk !== '0,0' && rnd() < 0.7) trees.push([x + R * 0.55, y - R * 0.35 * k, R * 0.24]);
    });
    // Straßen: geglättet über Kachelmitten
    const smooth = (list) => {
      const p = list.map(([q, r]) => px(q, r));
      let d = 'M' + f(p[0][0]) + ' ' + f(p[0][1]);
      for (let i = 1; i < p.length - 1; i++) {
        const m = [(p[i][0] + p[i + 1][0]) / 2, (p[i][1] + p[i + 1][1]) / 2];
        d += ' Q' + f(p[i][0]) + ' ' + f(p[i][1]) + ' ' + f(m[0]) + ' ' + f(m[1]);
      }
      const e = p[p.length - 1];
      return d + ' L' + f(e[0]) + ' ' + f(e[1]);
    };
    const road = roads.map(smooth).join(' ');
    const spawn = roads.map((rd) => { const [x, y] = px(rd[rd.length - 1][0], rd[rd.length - 1][1]); return E(x, y, R * 0.22, R * 0.22 * k); }).join('');
    // Bäume, Häuser, Türme, Burg (von hinten nach vorne)
    trees.sort((a, b) => a[1] - b[1]);
    trees.forEach(([x, y, H]) => {
      g.treeDark += P([[x, y - H], [x + H * 0.32, y - H * 0.18], [x - H * 0.32, y - H * 0.18]]) + P([[x, y - H * 0.62], [x + H * 0.4, y], [x - H * 0.4, y]]);
      g.treeLit += P([[x, y - H], [x - H * 0.32, y - H * 0.18], [x - H * 0.02, y - H * 0.18]]) + P([[x, y - H * 0.62], [x - H * 0.4, y], [x - H * 0.02, y]]);
    });
    const o = { bodyShadow: '', wall: '', wallTop: '', court: '', stoneBody: '', woodBody: '', woodTop: '', iceBody: '', iceTop: '', fire: '', orb: '', roofRed: '', roofRedLit: '', houseWall: '', flags: '' };
    const cyl = (x, y, rw, hh, part) => {
      o[part] += P([[x - rw, y], [x - rw, y - hh], [x + rw, y - hh], [x + rw, y]]) + E(x, y, rw, rw * 0.45);
    };
    houses.forEach((kk) => {
      const [q, r] = kk.split(',').map(Number);
      const [x, y] = px(q, r);
      const u = R * 0.2;
      o.bodyShadow += E(x + u * 0.3, y + u * 0.4, u * 1.4, u * 0.6);
      o.houseWall += P([[x - u, y], [x - u, y - u * 0.9], [x + u, y - u * 0.9], [x + u, y]]);
      o.roofRed += P([[x - u * 1.2, y - u * 0.85], [x, y - u * 1.9], [x + u * 1.2, y - u * 0.85]]);
      o.roofRedLit += P([[x, y - u * 1.9], [x + u * 1.2, y - u * 0.85], [x + u * 0.1, y - u * 0.85]]);
    });
    Object.keys(towers).forEach((kk) => {
      const [q, r] = kk.split(',').map(Number);
      const [x, y] = px(q, r);
      const u = R * 0.2, type = towers[kk];
      o.bodyShadow += E(x + u * 0.3, y + u * 0.3, u * 1.5, u * 0.65);
      o.stoneBody += E(x, y, u * 1.25, u * 0.55);
      if (type === 'archer') { cyl(x, y - u * 0.2, u * 0.75, u * 1.9, 'woodBody'); o.woodTop += E(x, y - u * 2.1, u * 0.85, u * 0.38); o.roofRed += P([[x - u * 0.9, y - u * 2.1], [x, y - u * 3.1], [x + u * 0.9, y - u * 2.1]]); }
      if (type === 'catapult') { cyl(x, y - u * 0.1, u * 0.95, u * 0.8, 'woodBody'); o.woodTop += E(x, y - u * 0.9, u * 0.95, u * 0.42); o.woodBody += P([[x - u * 0.1, y - u], [x + u * 0.9, y - u * 2.2], [x + u * 1.1, y - u * 2], [x + u * 0.1, y - u * 0.8]]); }
      if (type === 'freeze') { cyl(x, y - u * 0.1, u * 0.7, u * 0.9, 'stoneBody'); o.iceBody += P([[x - u * 0.55, y - u], [x, y - u * 2.8], [x + u * 0.55, y - u]]); o.iceTop += P([[x, y - u * 2.8], [x + u * 0.55, y - u], [x + u * 0.1, y - u]]); }
      if (type === 'chain') { cyl(x, y - u * 0.1, u * 0.7, u * 1.6, 'stoneBody'); o.orb += E(x, y - u * 2.2, u * 0.5, u * 0.5); }
      if (type === 'flame') { cyl(x, y - u * 0.1, u * 0.8, u * 1.2, 'stoneBody'); o.fire += P([[x - u * 0.6, y - u * 1.3], [x, y - u * 2.5], [x + u * 0.6, y - u * 1.3]]); }
    });
    // Burg in der Mitte
    {
      const [x, y] = px(0, 0), u = R * 0.2;
      o.bodyShadow += E(x + u * 0.4, y + u * 0.6, u * 3.2, u * 1.4);
      o.wall += E(x, y, u * 2.8, u * 1.25) + P([[x - u * 2.8, y], [x - u * 2.8, y - u * 0.9], [x + u * 2.8, y - u * 0.9], [x + u * 2.8, y]]);
      o.wallTop += E(x, y - u * 0.9, u * 2.8, u * 1.25);
      o.court += E(x, y - u * 0.9, u * 2.2, u * 0.95);
      [[-2.6, -0.2], [2.6, -0.2], [-1.4, 0.9], [1.4, 0.9], [0, -1.2]].forEach(([a, b]) => {
        const tx = x + a * u, ty = y + b * u;
        cyl(tx, ty, u * 0.42, u * 1.5, 'stoneBody');
        o.roofRed += P([[tx - u * 0.5, ty - u * 1.5], [tx, ty - u * 2.4], [tx + u * 0.5, ty - u * 1.5]]);
      });
      o.houseWall += P([[x - u * 0.8, y - u * 0.6], [x - u * 0.8, y - u * 2], [x + u * 0.8, y - u * 2], [x + u * 0.8, y - u * 0.6]]);
      o.roofRed += P([[x - u, y - u * 2], [x, y - u * 3.2], [x + u, y - u * 2]]);
      o.roofRedLit += P([[x, y - u * 3.2], [x + u, y - u * 2], [x + u * 0.1, y - u * 2]]);
      o.flags += P([[x, y - u * 3.2], [x, y - u * 4.2], [x + u * 0.7, y - u * 3.9], [x + u * 0.05, y - u * 3.6]]);
    }
    // Nebelinseln mit „?“ und Deko-Felsinseln im Wasser
    const fogAt = [[0.5, -6.2], [5.8, -5.6], [7.4, -3], [-6.6, 1.2], [-5.4, 6.2], [6.6, 2.2]];
    let fogSide = '', fogTop = '', fogTop2 = '';
    const qs = {};
    fogAt.forEach(([q, r], i) => {
      const [x, y] = px(q, r);
      const t = hexPts(x, y, 0.98);
      fogSide += P([t[4], t[3], t[2], [t[2][0], t[2][1] + sd * 1.4], [t[3][0], t[3][1] + sd * 1.4], [t[4][0], t[4][1] + sd * 1.4]]);
      for (let j = 0; j < 6; j++) {
        const tri = P([[x + (rnd() - 0.5) * R * 0.2, y + (rnd() - 0.5) * R * 0.12], t[j], t[(j + 1) % 6]]);
        if (j % 2) fogTop2 += tri; else fogTop += tri;
      }
      trees.push([x - R * 0.62, y + R * 0.2 * k, R * 0.3]);
      g.treeDark += P([[x + R * 0.6, y - R * 0.5], [x + R * 0.78, y - R * 0.08], [x + R * 0.42, y - R * 0.08]]);
      g.treeLit += P([[x + R * 0.6, y - R * 0.5], [x + R * 0.42, y - R * 0.08], [x + R * 0.59, y - R * 0.08]]);
      qs['q' + i] = { x: f(x), y: f(y + R * 0.28) };
    });
    const isles = [[-7.2, -2.4], [3.2, -7], [8.2, -0.4], [-2.6, 6.4], [-8.4, 4.6], [9, -5]];
    let isleSide = '', isleTop = '', isleTop2 = '';
    isles.forEach(([q, r]) => {
      const [x, y] = px(q, r), u = R * 0.42;
      isleSide += P([[x - u, y], [x + u, y], [x + u * 0.8, y + u * 0.7], [x - u * 0.8, y + u * 0.7]]);
      isleTop += P([[x - u, y], [x - u * 0.6, y - u * 0.45], [x + u * 0.5, y - u * 0.5], [x + u, y]]);
      isleTop2 += P([[x - u * 0.6, y - u * 0.45], [x + u * 0.5, y - u * 0.5], [x, y - u * 0.15]]);
      g.treeDark += P([[x - u * 0.3, y - u * 1.6], [x, y - u * 0.3], [x - u * 0.6, y - u * 0.3]]) + P([[x + u * 0.35, y - u * 1.3], [x + u * 0.62, y - u * 0.25], [x + u * 0.08, y - u * 0.25]]);
      g.treeLit += P([[x - u * 0.3, y - u * 1.6], [x - u * 0.6, y - u * 0.3], [x - u * 0.32, y - u * 0.3]]) + P([[x + u * 0.35, y - u * 1.3], [x + u * 0.08, y - u * 0.25], [x + u * 0.33, y - u * 0.25]]);
    });
    // Wellenlinien im Wasser
    let waves = '';
    for (let i = 0; i < 26; i++) {
      const x = rnd() * w, y = rnd() * h, l = R * (0.3 + rnd() * 0.4);
      waves += 'M' + f(x) + ' ' + f(y) + 'q' + f(l / 2) + ' ' + f(-R * 0.08) + ' ' + f(l) + ' 0';
    }
    let range = '', selHex = '';
    if (sel) {
      const [x, y] = px(-1, 0);
      range = E(x, y, R * 2.4, R * 2.4 * k);
      selHex = P(hexPts(x, y, 0.9));
    }
    return Object.assign({ w, h, waves, waveW: Math.max(1, R * 0.04), road, roadW1: f(R * 0.4), roadW2: f(R * 0.3), spawn, range, selHex, selW: Math.max(2, f(R * 0.06)), fogSide, fogTop, fogTop2, isleSide, isleTop, isleTop2, qFs: f(R * 0.85), qStroke: f(R * 0.06) }, g, o, qs);
  }
}
</script>
</body>
</html>
