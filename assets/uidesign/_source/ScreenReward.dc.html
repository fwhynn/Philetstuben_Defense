<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Kartenbelohnung</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,800;9..144,900&amp;family=Barlow+Semi+Condensed:wght@500;600;700&amp;family=Inter:wght@500;600;700&amp;display=swap">
<style>
body{margin:0}
button{font:inherit;color:inherit}
.po{padding:2px;box-sizing:border-box;background:linear-gradient(170deg,#e9c46a,#8a6a26 60%,#c9a24a);clip-path:polygon(12px 0,calc(100% - 12px) 0,100% 12px,100% calc(100% - 12px),calc(100% - 12px) 100%,12px 100%,0 calc(100% - 12px),0 12px)}
.pi{height:100%;box-sizing:border-box;background:linear-gradient(180deg,#17301f,#0f2219);clip-path:polygon(11px 0,calc(100% - 11px) 0,100% 11px,100% calc(100% - 11px),calc(100% - 11px) 100%,11px 100%,0 calc(100% - 11px),0 11px)}
.ui{font-family:'Barlow Semi Condensed','Arial Narrow',sans-serif;color:#f4ecd6}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:10px;font:700 19px 'Barlow Semi Condensed',sans-serif;white-space:nowrap}
.gold{border:2px solid #9c6a17;background:linear-gradient(180deg,#ffe48a,#e8ac38);color:#2a1f10;box-shadow:inset 0 2px 0 rgba(255,255,255,.5),0 3px 0 #7a5414}
.ghost{border:1.5px solid #c9a24a;background:rgba(0,0,0,.25);color:#f4ecd6}
.frame{position:absolute;overflow:hidden;border-radius:18px;outline:1px solid #41594a}
.lab{position:absolute;margin:0;font:700 15px Inter,sans-serif;color:#bfd0c6}
</style>
</helmet>
<div style="position: relative; width: 1970px; height: 1020px; background: #0f1a15; font-family: Inter, system-ui, sans-serif; color: #f6f2e4">
  <p class="lab" style="left: 40px; top: 40px">3 · Kartenbelohnung nach der Welle · Desktop 1440 × 900</p>
  <p class="lab" style="left: 1540px; top: 40px">Handy 390 × 844</p>

  <div class="frame ui" style="left: 40px; top: 80px; width: 1440px; height: 900px">
    <dc-import name="Board" w="{{ 1440 }}" h="{{ 900 }}" r="{{ 52 }}" cx="{{ 720 }}" cy="{{ 430 }}" hint-size="1440px,900px"></dc-import>
    <div style="position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 55%, rgba(6, 14, 10, 0.72), rgba(6, 14, 10, 0.88))"></div>
    <div class="po" role="status" style="position: absolute; left: 50%; top: 40px; transform: translateX(-50%); height: 60px; background: linear-gradient(170deg, #fff3c4, #c9952f 60%, #f3d58a)">
      <div class="pi" style="display: flex; align-items: center; gap: 12px; padding: 0 26px; background: linear-gradient(180deg, #24452f, #163322); font-size: 28px; font-weight: 700; white-space: nowrap"><dc-import name="Icon" glyph="treasure" size="{{ 26 }}" fill="#f3d58a" hint-size="26px,26px"></dc-import><span style="color: #f3c94c">Welle 20 geschafft</span><span style="color: #c9a24a">·</span>Belohnung</div>
    </div>
    <p style="position: absolute; left: 0; right: 0; top: 122px; margin: 0; text-align: center; font-size: 22px; font-weight: 600">Wähle 1 von 3 Hexkarten. Sie kommt in dein Deck.</p>
    <div role="radiogroup" aria-label="Belohnungskarten" style="position: absolute; left: 50%; top: 190px; transform: translateX(-50%); display: flex; gap: 34px; align-items: flex-end">
      <sc-for list="{{choices}}" as="cd" hint-placeholder-count="3">
        <button role="radio" aria-checked="{{cd.checked}}" style="padding: 0; border: 0; background: none"><dc-import name="Card" rarity="{{cd.rarity}}" num="{{cd.num}}" name-text="{{cd.name}}" kind="{{cd.kind}}" sub="{{cd.sub}}" lines="{{cd.lines}}" stats="{{cd.stats}}" state="{{cd.state}}" w="{{ 236 }}" hint-size="236px,307px"></dc-import></button>
      </sc-for>
    </div>
    <div style="position: absolute; left: 50%; top: 560px; transform: translateX(-50%); display: flex; gap: 12px">
      <button class="btn gold"><dc-import name="Icon" glyph="check" size="{{ 20 }}" fill="currentColor" hint-size="20px,20px"></dc-import>Signalkreuzung nehmen</button>
      <button class="btn ghost">Überspringen · +10 Gold</button>
    </div>
    <section class="po" aria-label="Karte entfernen" style="position: absolute; left: 50%; top: 650px; transform: translateX(-50%); width: 1060px; height: 196px">
      <div class="pi" style="padding: 14px 20px; display: flex; flex-direction: column; gap: 10px">
        <div style="display: flex; align-items: center; justify-content: space-between">
          <b style="font-size: 20px">Optional: eine Karte aus dem Deck entfernen</b>
          <div style="display: flex; gap: 10px"><button class="btn ghost" style="min-height: 40px; font-size: 17px">Deck anschauen</button><button class="btn ghost" style="min-height: 40px; font-size: 17px">Map anschauen</button><button class="btn ghost" style="min-height: 40px; font-size: 17px">Keine Karte entfernen</button></div>
        </div>
        <div style="display: flex; gap: 10px; align-items: flex-end">
          <sc-for list="{{deck}}" as="d" hint-placeholder-count="9">
            <button aria-label="{{d.aria}}" style="padding: 0; border: 0; background: none"><dc-import name="Card" rarity="{{d.rarity}}" num="{{d.num}}" name-text="{{d.name}}" kind="{{d.kind}}" sub="" state="{{d.state}}" w="{{ 82 }}" hint-size="82px,116px"></dc-import></button>
          </sc-for>
        </div>
      </div>
    </section>
  </div>

  <div class="frame ui" style="left: 1540px; top: 80px; width: 390px; height: 844px">
    <dc-import name="Board" w="{{ 390 }}" h="{{ 844 }}" r="{{ 24 }}" cx="{{ 195 }}" cy="{{ 400 }}" hint-size="390px,844px"></dc-import>
    <div style="position: absolute; inset: 0; background: rgba(6, 14, 10, 0.86)"></div>
    <div class="po" style="position: absolute; left: 50%; top: 18px; transform: translateX(-50%); height: 44px; background: linear-gradient(170deg, #fff3c4, #c9952f 60%, #f3d58a)">
      <div class="pi" style="display: flex; align-items: center; gap: 8px; padding: 0 14px; background: linear-gradient(180deg, #24452f, #163322); font-size: 17px; font-weight: 700; white-space: nowrap"><span style="color: #f3c94c">Welle 20</span>· Belohnung</div>
    </div>
    <p style="position: absolute; left: 14px; right: 14px; top: 76px; margin: 0; text-align: center; font-size: 17px; font-weight: 600">Wähle 1 von 3 Hexkarten.</p>
    <div style="position: absolute; left: 14px; right: 14px; top: 116px; display: flex; flex-direction: column; gap: 10px">
      <sc-for list="{{choices}}" as="cd" hint-placeholder-count="3">
        <button role="radio" aria-checked="{{cd.checked}}" style="display: flex; align-items: center; gap: 12px; padding: 10px; border-radius: 14px; border: {{cd.border}}; background: #13261c; text-align: left">
          <dc-import name="Card" rarity="{{cd.rarity}}" num="{{cd.num}}" name-text="{{cd.name}}" kind="{{cd.kind}}" sub="" w="{{ 82 }}" hint-size="82px,116px"></dc-import>
          <span style="flex: 1; display: flex; flex-direction: column; gap: 3px"><b style="font-size: 18px">{{cd.plain}}</b><span style="font-size: 15px; color: #cfd9cf">{{cd.sub}}</span><span style="font-size: 15px; color: #e7c66a">{{cd.summary}}</span></span>
        </button>
      </sc-for>
    </div>
    <div style="position: absolute; left: 14px; right: 14px; bottom: 16px; display: flex; flex-direction: column; gap: 8px">
      <button class="btn gold" style="font-size: 17px">Signalkreuzung nehmen</button>
      <div style="display: flex; gap: 8px"><button class="btn ghost" style="flex: 1; font-size: 16px; padding: 0 8px">Überspringen</button><button class="btn ghost" style="flex: 1; font-size: 16px; padding: 0 8px">Karte entfernen</button></div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1970,"height":1020}}'>
class Component extends DCLogic {
  renderVals() {
    const ln = (icon, text, color) => ({ icon, text, color });
    const choices = [
      { rarity: 'uncommon', num: 1, name: 'T-Kreuzung', plain: 'T-Kreuzung', kind: 'tee', sub: 'Durchgang mit Abzweig', lines: [ln('towerSlot', '2 Turmplätze', '#8a5a12')], stats: [], state: 'normal', summary: '2 Turmplätze', checked: 'false', border: '1px solid #2f4a3a' },
      { rarity: 'epic', num: 2, name: 'Signal­kreuzung', plain: 'Signalkreuzung', kind: 'cross', sub: 'Vier Straßenenden', lines: [ln('towerSlot', '2 Turmplätze', '#8a5a12'), ln('range', '+20 % Reichweite', '#c2362b')], stats: [], state: 'selected', summary: '2 Turmplätze · +20 % Reichweite', checked: 'true', border: '2px solid #f3c94c' },
      { rarity: 'legendary', num: 3, name: 'Kronen­kreuzung', plain: 'Kronenkreuzung', kind: 'crown', sub: 'Sechs Anschlüsse', lines: [ln('towerSlot', '2 Turmplätze', '#8a5a12'), ln('damage', '+20 % Schaden', '#d0452a'), ln('range', '+20 % Reichweite', '#c2362b')], stats: [], state: 'normal', summary: '+20 % Schaden · +20 % Reichweite', checked: 'false', border: '1px solid #2f4a3a' }
    ];
    const d = (rarity, name, kind, num, state) => ({ rarity, name, kind, num, state: state || 'normal', aria: name + ' entfernen' });
    return {
      choices,
      deck: [d('common', 'Gerade', 'straight', 1), d('common', 'Gerade', 'straight', 2), d('common', 'Kurve', 'curve', 3), d('uncommon', 'Sack­gasse', 'deadEnd', 4, 'hover'), d('rare', 'Kurve', 'curve', 5), d('uncommon', 'T-Kreu­zung', 'tee', 6), d('rare', 'Kreu­zung', 'cross', 7), d('epic', 'Signal­kreuzung', 'cross', 8), d('common', 'Gerade', 'straight', 9), d('common', 'Kurve', 'curve', 10)]
    };
  }
}
</script>
</body>
</html>
