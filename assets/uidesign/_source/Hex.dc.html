<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Hex-Kachel</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,900&amp;family=Barlow+Semi+Condensed:wght@600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="position: relative; flex: none; width: {{w}}px; height: {{h}}px; transform: translateY({{lift}}px); font-family: 'Barlow Semi Condensed', 'Arial Narrow', system-ui, sans-serif; color: {{ink}}; opacity: {{opacity}}">
  <svg viewBox="0 0 866 1000" width="{{w}}" height="{{h}}" aria-hidden="true" style="position: absolute; left: 0; top: 0; overflow: visible; filter: {{filter}}">
    <defs>
      <linearGradient id="hx-{{family}}-rim" x1="0.35" y1="0" x2="0.6" y2="1">
        <stop offset="0" stop-color="{{c.rim0}}"></stop>
        <stop offset="{{c.rimMid}}" stop-color="{{c.rim1}}"></stop>
        <stop offset="1" stop-color="{{c.rim2}}"></stop>
      </linearGradient>
      <radialGradient id="hx-{{family}}-fill" cx="0.5" cy="0.28" r="0.78">
        <stop offset="0" stop-color="{{c.fill0}}"></stop>
        <stop offset="{{c.fillMid}}" stop-color="{{c.fill1}}"></stop>
        <stop offset="1" stop-color="{{c.fill2}}"></stop>
      </radialGradient>
      <linearGradient id="hx-sel-rim" x1="0.35" y1="0" x2="0.6" y2="1">
        <stop offset="0" stop-color="#fff3c4"></stop>
        <stop offset="0.45" stop-color="#e9b949"></stop>
        <stop offset="1" stop-color="#9c6a17"></stop>
      </linearGradient>
      <linearGradient id="hx-{{family}}-shine" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#ffffff" stop-opacity="{{c.shine}}"></stop>
        <stop offset="1" stop-color="#ffffff" stop-opacity="0"></stop>
      </linearGradient>
    </defs>
    <polygon points="433,20 848.7,260 848.7,740 433,980 17.3,740 17.3,260" fill="{{rimFill}}" stroke="{{rimFill}}" stroke-width="34" stroke-linejoin="round"></polygon>
    <polygon points="433,60 814,280 814,720 433,940 52,720 52,280" fill="{{grooveFill}}" stroke="{{grooveFill}}" stroke-width="16" stroke-linejoin="round"></polygon>
    <polygon points="433,80 796.7,290 796.7,710 433,920 69.3,710 69.3,290" fill="url(#hx-{{family}}-fill)" stroke="url(#hx-{{family}}-fill)" stroke-width="12" stroke-linejoin="round"></polygon>
    <path d="M69.3 290 L433 80 L796.7 290 L796.7 430 Q433 345 69.3 430 Z" fill="url(#hx-{{family}}-shine)"></path>
  </svg>
  <div style="position: absolute; left: 10%; right: 10%; top: 19%; bottom: 19%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: {{gap}}px; text-align: center; text-shadow: {{textShadow}}">
    <sc-if value="{{showIcon}}" hint-placeholder-val="{{ true }}">
      <dc-import name="Icon" glyph="{{icon}}" size="{{iconSize}}" fill="{{iconFill}}" hint-size="24px,24px"></dc-import>
    </sc-if>
    <sc-if value="{{q}}" hint-placeholder-val="{{ false }}">
      <span style="font-family: Fraunces, Georgia, serif; font-weight: 900; font-size: {{qSize}}px; line-height: 1; opacity: 0.85">?</span>
    </sc-if>
    <sc-if value="{{hasLabel}}" hint-placeholder-val="{{ true }}">
      <span lang="de" style="font-weight: 700; font-size: {{fs}}px; line-height: 1.08; letter-spacing: 0.005em; hyphens: manual; overflow-wrap: break-word; max-width: 100%">{{label}}</span>
    </sc-if>
    <sc-if value="{{hasSub}}" hint-placeholder-val="{{ false }}">
      <span style="font-weight: 600; font-size: {{subFs}}px; line-height: 1.2; color: {{subColor}}">{{sub}}</span>
    </sc-if>
  </div>
  <sc-if value="{{hasBadge}}" hint-placeholder-val="{{ false }}">
    <div style="position: absolute; right: 4%; top: 13%; width: {{bs}}px; height: {{bs}}px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: {{badgeBg}}; color: {{badgeInk}}; box-shadow: 0 0 0 2px {{badgeRing}}, 0 3px 6px rgba(0,0,0,0.45)">
      <dc-import name="Icon" glyph="{{badgeGlyph}}" size="{{bis}}" fill="currentColor" hint-size="14px,14px"></dc-import>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"family":{"editor":"enum","default":"gold","options":["gold","green","cream","fog"]},"state":{"editor":"enum","default":"normal","options":["normal","hover","pressed","focus","selected","disabled"]},"h":{"editor":"int","default":240,"min":40,"max":600},"emph":{"editor":"boolean","default":true},"icon":{"editor":"text","default":"play"},"label":{"editor":"text","default":"Spielen"},"sub":{"editor":"text","default":"Fortsetzen · Welle 20"},"badge":{"editor":"enum","default":"","options":["","upgrade","lock"]},"q":{"editor":"boolean","default":false},"$preview":{"width":240,"height":280}}'>
class Component extends DCLogic {
  renderVals() {
    const P = {
      gold:  { rim0: '#fff3c4', rim1: '#e9b949', rimMid: 0.45, rim2: '#9c6a17', groove: '#7a5414', fill0: '#ffe9a0', fill1: '#f4c552', fillMid: 0.48, fill2: '#dc9c2c', shine: 0.55, depth: '#6b4810', ink: '#2a1f10', sub: '#4a3410', ts: '0 1px 0 rgba(255,246,214,0.55)' },
      green: { rim0: '#a9c98f', rim1: '#5f8a5a', rimMid: 0.5, rim2: '#2e4b33', groove: '#102117', fill0: '#4a8059', fill1: '#2b5638', fillMid: 0.52, fill2: '#1d3d28', shine: 0.22, depth: '#0a160f', ink: '#f4ecd6', sub: '#cfe0c8', ts: '0 1px 0 rgba(0,0,0,0.45)' },
      cream: { rim0: '#fffaf0', rim1: '#d8c79c', rimMid: 0.55, rim2: '#9c8a5d', groove: '#7b6c49', fill0: '#fffaf0', fill1: '#f1e6c6', fillMid: 0.55, fill2: '#dfcd9f', shine: 0.5, depth: '#5e5236', ink: '#2b281f', sub: '#4d4635', ts: '0 1px 0 rgba(255,255,255,0.6)' },
      fog:   { rim0: '#56625b', rim1: '#414c46', rimMid: 0.5, rim2: '#323c37', groove: '#1a201d', fill0: '#46514b', fill1: '#3a4440', fillMid: 0.5, fill2: '#2c3430', shine: 0.08, depth: '#0d1110', ink: '#c9d2cc', sub: '#b4bfb8', ts: 'none' }
    };
    const family = P[this.props.family] ? this.props.family : 'gold';
    const c = P[family];
    const state = this.props.state || 'normal';
    const h = this.props.h ?? 240;
    const w = Math.round(h * 0.866);
    const emph = !!this.props.emph;
    const d = Math.max(3, Math.round(h * 0.03));
    const blur = Math.round(h * 0.07);
    let lift = 0, depth = d, bright = '', glow = '', opacity = 1;
    if (state === 'hover') { lift = -Math.max(2, Math.round(h * 0.018)); depth = d + 1; bright = 'brightness(1.08) '; }
    if (state === 'pressed') { lift = Math.round(d * 0.65); depth = Math.max(1, Math.round(d * 0.35)); bright = 'brightness(0.93) '; }
    if (state === 'focus') { glow = ' drop-shadow(0 0 ' + Math.round(h * 0.05) + 'px rgba(255,225,152,0.75))'; }
    if (state === 'selected') { lift = -Math.max(1, Math.round(h * 0.012)); glow = ' drop-shadow(0 0 ' + Math.round(h * 0.06) + 'px rgba(246,201,90,0.6))'; }
    if (state === 'disabled') { bright = 'grayscale(0.75) brightness(0.78) '; opacity = 0.72; }
    const filter = bright + 'drop-shadow(0 ' + depth + 'px 0 ' + c.depth + ') drop-shadow(0 ' + (depth * 2) + 'px ' + blur + 'px rgba(0,0,0,0.45))' + glow;
    const label = this.props.label ?? '';
    const sub = this.props.sub ?? '';
    const q = !!this.props.q;
    const icon = this.props.icon ?? '';
    const badge = state === 'disabled' && !this.props.badge ? 'lock' : (this.props.badge || '');
    const fs = emph ? Math.round(h * 0.15) : Math.max(13, Math.round(h * 0.096));
    const iconSize = !label && !sub ? Math.round(h * 0.36) : Math.max(18, Math.round(h * 0.2));
    const bs = Math.max(20, Math.round(h * 0.17));
    return {
      w, h, lift, filter, opacity, c,
      family,
      ink: c.ink,
      textShadow: c.ts,
      rimFill: state === 'focus' ? '#ffe198' : state === 'selected' ? 'url(#hx-sel-rim)' : 'url(#hx-' + family + '-rim)',
      grooveFill: state === 'focus' ? '#c99a2e' : state === 'selected' ? '#7a5414' : c.groove,
      gap: Math.max(2, Math.round(h * 0.022)),
      showIcon: !q && !!icon,
      icon, iconSize,
      iconFill: this.props.iconColor || 'currentColor',
      q, qSize: Math.round(h * 0.34),
      hasLabel: !!label, label, fs,
      hasSub: !!sub, sub,
      subFs: Math.max(13, Math.round(h * (emph ? 0.068 : 0.075))),
      subColor: this.props.subColor || c.sub,
      hasBadge: !!badge,
      badgeGlyph: badge === 'lock' ? 'lock' : 'upgradeBadge',
      badgeBg: badge === 'lock' ? '#2c3430' : '#ffe198',
      badgeInk: badge === 'lock' ? '#e6ece8' : '#5b3d0c',
      badgeRing: badge === 'lock' ? '#56625b' : '#9c6a17',
      bs, bis: Math.round(bs * 0.58)
    };
  }
}
</script>
</body>
</html>
