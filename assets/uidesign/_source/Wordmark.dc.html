<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Wortmarke AutoHex TD</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,900&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="display: block; width: {{width}}px; height: {{height}}px; font-family: Fraunces, Georgia, serif">
  <sc-if value="{{isFull}}" hint-placeholder-val="{{ true }}">
    <svg viewBox="0 0 760 170" width="{{width}}" height="{{height}}" role="img" aria-label="AutoHex TD" style="display: block; overflow: visible">
      <defs>
        <linearGradient id="wm-gold" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#fff6d6"></stop>
          <stop offset="0.45" stop-color="#f3d58a"></stop>
          <stop offset="0.78" stop-color="#d9a53c"></stop>
          <stop offset="1" stop-color="#b9831f"></stop>
        </linearGradient>
        <linearGradient id="wm-gloss" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0.12" stop-color="#ffffff" stop-opacity="0.75"></stop>
          <stop offset="0.42" stop-color="#ffffff" stop-opacity="0"></stop>
        </linearGradient>
      </defs>
      <text x="380" y="132" text-anchor="middle" textLength="720" lengthAdjust="spacingAndGlyphs" font-family="Fraunces, Georgia, serif" font-weight="900" font-size="122" fill="#3a2506" stroke="#1f1404" stroke-width="12" stroke-linejoin="round" paint-order="stroke">AutoHex TD</text>
      <text x="380" y="124" text-anchor="middle" textLength="720" lengthAdjust="spacingAndGlyphs" font-family="Fraunces, Georgia, serif" font-weight="900" font-size="122" fill="url(#wm-gold)" stroke="#4f350d" stroke-width="7" stroke-linejoin="round" paint-order="stroke">AutoHex TD</text>
      <text x="380" y="124" text-anchor="middle" textLength="720" lengthAdjust="spacingAndGlyphs" font-family="Fraunces, Georgia, serif" font-weight="900" font-size="122" fill="url(#wm-gloss)">AutoHex TD</text>
    </svg>
  </sc-if>
  <sc-if value="{{isCompact}}" hint-placeholder-val="{{ false }}">
    <svg viewBox="0 0 600 170" width="{{width}}" height="{{height}}" role="img" aria-label="AutoHex TD" style="display: block; overflow: visible">
      <defs>
        <linearGradient id="wm-gold-c" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#fff6d6"></stop>
          <stop offset="0.45" stop-color="#f3d58a"></stop>
          <stop offset="0.78" stop-color="#d9a53c"></stop>
          <stop offset="1" stop-color="#b9831f"></stop>
        </linearGradient>
        <linearGradient id="wm-gloss-c" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0.12" stop-color="#ffffff" stop-opacity="0.75"></stop>
          <stop offset="0.42" stop-color="#ffffff" stop-opacity="0"></stop>
        </linearGradient>
        <linearGradient id="wm-hex-c" x1="0.35" y1="0" x2="0.6" y2="1">
          <stop offset="0" stop-color="#fff3c4"></stop>
          <stop offset="0.45" stop-color="#e9b949"></stop>
          <stop offset="1" stop-color="#9c6a17"></stop>
        </linearGradient>
      </defs>
      <text x="10" y="132" textLength="440" lengthAdjust="spacingAndGlyphs" font-family="Fraunces, Georgia, serif" font-weight="900" font-size="118" fill="#3a2506" stroke="#1f1404" stroke-width="12" stroke-linejoin="round" paint-order="stroke">AutoHex</text>
      <text x="10" y="124" textLength="440" lengthAdjust="spacingAndGlyphs" font-family="Fraunces, Georgia, serif" font-weight="900" font-size="118" fill="url(#wm-gold-c)" stroke="#4f350d" stroke-width="7" stroke-linejoin="round" paint-order="stroke">AutoHex</text>
      <text x="10" y="124" textLength="440" lengthAdjust="spacingAndGlyphs" font-family="Fraunces, Georgia, serif" font-weight="900" font-size="118" fill="url(#wm-gloss-c)">AutoHex</text>
      <polygon points="532,22 590,55.5 590,122.5 532,156 474,122.5 474,55.5" fill="#4f350d" stroke="#4f350d" stroke-width="10" stroke-linejoin="round"></polygon>
      <polygon points="532,16 588,48.5 588,113.5 532,146 476,113.5 476,48.5" fill="url(#wm-hex-c)" stroke="#4f350d" stroke-width="5" stroke-linejoin="round"></polygon>
      <text x="532" y="101" text-anchor="middle" textLength="76" lengthAdjust="spacingAndGlyphs" font-family="Fraunces, Georgia, serif" font-weight="900" font-size="54" fill="#2a1f10">TD</text>
    </svg>
  </sc-if>
  <sc-if value="{{isMono}}" hint-placeholder-val="{{ false }}">
    <svg viewBox="0 0 760 170" width="{{width}}" height="{{height}}" role="img" aria-label="AutoHex TD" style="display: block; overflow: visible">
      <text x="380" y="124" text-anchor="middle" textLength="720" lengthAdjust="spacingAndGlyphs" font-family="Fraunces, Georgia, serif" font-weight="900" font-size="122" fill="{{monoColor}}">AutoHex TD</text>
    </svg>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"variant":{"editor":"enum","default":"full","options":["full","compact","mono"]},"width":{"editor":"int","default":760,"min":120,"max":1600},"monoColor":{"editor":"color","default":"#f6f2e4","options":["#f6f2e4","#1b2a21","#ffe198"]},"$preview":{"width":760,"height":180}}'>
class Component extends DCLogic {
  renderVals() {
    const variant = this.props.variant || 'full';
    const width = this.props.width ?? 760;
    const vbw = variant === 'compact' ? 600 : 760;
    return {
      width,
      height: Math.round(width * 170 / vbw),
      isFull: variant === 'full',
      isCompact: variant === 'compact',
      isMono: variant === 'mono',
      monoColor: this.props.monoColor || '#f6f2e4'
    };
  }
}
</script>
</body>
</html>
