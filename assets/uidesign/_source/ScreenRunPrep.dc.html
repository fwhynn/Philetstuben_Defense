<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Run-Vorbereitung</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,800;9..144,900&amp;family=Barlow+Semi+Condensed:wght@500;600;700&amp;family=Inter:wght@500;600;700&amp;display=swap">
<style>
body{margin:0}
button{font:inherit;color:inherit}
.po{padding:2px;box-sizing:border-box;background:linear-gradient(170deg,#e9c46a,#8a6a26 60%,#c9a24a);clip-path:polygon(12px 0,calc(100% - 12px) 0,100% 12px,100% calc(100% - 12px),calc(100% - 12px) 100%,12px 100%,0 calc(100% - 12px),0 12px)}
.pi{height:100%;box-sizing:border-box;background:linear-gradient(180deg,#17301f,#0f2219);clip-path:polygon(11px 0,calc(100% - 11px) 0,100% 11px,100% calc(100% - 11px),calc(100% - 11px) 100%,11px 100%,0 calc(100% - 11px),0 11px)}
.ui{font-family:'Barlow Semi Condensed','Arial Narrow',sans-serif;color:#f4ecd6}
.t1{margin:0;font:900 38px/1.05 Fraunces,Georgia,serif;color:#f3d58a}
.eb{margin:0;font:700 14px 'Barlow Semi Condensed',sans-serif;letter-spacing:.14em;color:#e7c66a}
.h3{margin:0;font:700 20px 'Barlow Semi Condensed',sans-serif;color:#f6efd8}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:10px;font:700 19px 'Barlow Semi Condensed',sans-serif;white-space:nowrap}
.gold{border:2px solid #9c6a17;background:linear-gradient(180deg,#ffe48a,#e8ac38);color:#2a1f10;box-shadow:inset 0 2px 0 rgba(255,255,255,.5),0 3px 0 #7a5414}
.ghost{border:1.5px solid #c9a24a;background:rgba(0,0,0,.2);color:#f4ecd6}
.opt{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:12px;border:1.5px solid #3d5a46;background:#13261c;text-align:left}
.opt.sel{border:2px solid #f3c94c;background:#1f3a27;box-shadow:0 0 0 3px rgba(243,201,76,.18)}
.opt.lock{border-style:dashed;color:#c9d2cc}
.frame{position:absolute;overflow:hidden;border-radius:18px;outline:1px solid #41594a}
.lab{position:absolute;margin:0;font:700 15px Inter,sans-serif;color:#bfd0c6}
</style>
</helmet>
<div style="position: relative; width: 1970px; height: 1020px; background: #0f1a15; font-family: Inter, system-ui, sans-serif; color: #f6f2e4">
  <p class="lab" style="left: 40px; top: 40px">1 · Run-Vorbereitung · Desktop 1440 × 900</p>
  <p class="lab" style="left: 1540px; top: 40px">Handy 390 × 844</p>

  <div class="frame" style="left: 40px; top: 80px; width: 1440px; height: 900px">
    <dc-import name="Backdrop" w="{{ 1440 }}" h="{{ 900 }}" hint-size="1440px,900px"></dc-import>
    <div style="position: absolute; inset: 0; background: rgba(5, 10, 7, 0.55)"></div>
    <section class="po ui" role="dialog" aria-labelledby="rp-title" style="position: absolute; left: 160px; top: 44px; width: 1120px; height: 812px; filter: drop-shadow(0 16px 30px rgba(0, 0, 0, 0.6))">
      <div class="pi" style="padding: 26px 32px; display: flex; flex-direction: column; gap: 16px">
        <div><p class="eb">RUNVORBEREITUNG</p><h2 id="rp-title" class="t1">Run vorbereiten</h2></div>
        <div style="display: grid; grid-template-columns: 1fr 1.6fr; gap: 24px">
          <div style="display: flex; flex-direction: column; gap: 10px">
            <h3 class="h3">Schwierigkeit</h3>
            <button class="opt sel" aria-pressed="true"><dc-import name="Hex" family="gold" h="{{ 48 }}" icon="play" label="" sub="" hint-size="42px,48px"></dc-import><span style="display: flex; flex-direction: column"><b style="font-size: 19px">Stufe 1 · Standard</b><span style="font-size: 15px; color: #cfd9cf">Ein Base-Ausgang. Lege eine von drei Handkarten.</span></span></button>
            <button class="opt lock" aria-disabled="true"><dc-import name="Hex" family="fog" h="{{ 48 }}" icon="lock" label="" sub="" hint-size="42px,48px"></dc-import><span style="display: flex; flex-direction: column"><b style="font-size: 19px">Stufe 2 · Zwei Fronten</b><span style="font-size: 15px">Zwei Base-Ausgänge, fünf Handkarten · ab Welle 35</span></span></button>
          </div>
          <div style="display: flex; flex-direction: column; gap: 10px">
            <h3 class="h3">Startfestung</h3>
            <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
              <sc-for list="{{heroes}}" as="hr" hint-placeholder-count="3">
                <button class="{{hr.cls}}" aria-pressed="{{hr.pressed}}" style="flex-direction: column; align-items: flex-start; gap: 6px">
                  <span style="display: flex; align-items: center; gap: 8px"><dc-import name="Hex" family="{{hr.family}}" h="{{ 44 }}" icon="base" label="" sub="" hint-size="38px,44px"></dc-import><b style="font-size: 19px">{{hr.name}}</b></span>
                  <span style="font-size: 15px; color: #cfd9cf; line-height: 1.3">{{hr.desc}}</span>
                </button>
              </sc-for>
            </div>
          </div>
        </div>
        <div style="height: 1px; background: rgba(201, 162, 74, 0.35)"></div>
        <div style="display: flex; align-items: baseline; justify-content: space-between">
          <h3 class="h3">Turmauswahl</h3>
          <span style="font-size: 17px; font-weight: 700; color: #f3c94c">5 / 5 gewählt</span>
        </div>
        <div style="display: grid; grid-template-columns: repeat(9, minmax(0, 1fr)); gap: 8px">
          <sc-for list="{{towers}}" as="t" hint-placeholder-count="9">
            <button aria-pressed="{{t.pressed}}" aria-label="{{t.aria}}" style="position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 2px 8px; border-radius: 12px; border: {{t.border}}; background: {{t.bg}}; opacity: {{t.op}}">
              <dc-import name="Hex" family="{{t.family}}" state="{{t.state}}" h="{{ 64 }}" icon="{{t.icon}}" icon-color="{{t.color}}" label="" sub="" hint-size="55px,64px"></dc-import>
              <span style="font-size: 16px; font-weight: 700; line-height: 1.1; text-align: center">{{t.name}}</span>
              <span style="font-size: 13px; color: #cfd9cf">{{t.note}}</span>
              <sc-if value="{{t.check}}" hint-placeholder-val="{{ false }}"><span style="position: absolute; right: 6px; top: 6px; display: inline-flex; color: #f3c94c"><dc-import name="Icon" glyph="check" size="{{ 20 }}" fill="currentColor" hint-size="20px,20px"></dc-import></span></sc-if>
            </button>
          </sc-for>
        </div>
        <details open style="border-radius: 12px; border: 1px solid #3d5a46; background: rgba(0, 0, 0, 0.18); padding: 10px 14px">
          <summary style="font-size: 18px; font-weight: 700; cursor: pointer">Vorlagen</summary>
          <div style="display: flex; gap: 10px; margin-top: 10px">
            <sc-for list="{{presets}}" as="p" hint-placeholder-count="3">
              <span style="flex: 1; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 10px; border-radius: 10px; background: #13261c; border: 1px solid #3d5a46"><span style="display: flex; flex-direction: column"><b style="font-size: 17px">{{p.name}}</b><span style="font-size: 14px; color: #cfd9cf">{{p.towers}}</span></span><span class="btn ghost" style="min-height: 40px; padding: 0 12px; font-size: 16px">Laden</span></span>
            </sc-for>
          </div>
        </details>
        <div style="margin-top: auto; display: flex; justify-content: flex-end; gap: 12px">
          <button class="btn ghost">Zurück zum Run</button>
          <button class="btn gold"><dc-import name="Icon" glyph="play" size="{{ 20 }}" fill="currentColor" hint-size="20px,20px"></dc-import>Run mit dieser Turmauswahl starten</button>
        </div>
      </div>
    </section>
  </div>

  <div class="frame" style="left: 1540px; top: 80px; width: 390px; height: 844px">
    <dc-import name="Backdrop" w="{{ 390 }}" h="{{ 844 }}" portrait="{{ true }}" islands="{{ false }}" hint-size="390px,844px"></dc-import>
    <section class="ui" role="dialog" aria-label="Run vorbereiten" style="position: absolute; inset: 0; display: flex; flex-direction: column; background: rgba(13, 26, 19, 0.92)">
      <header style="display: flex; align-items: center; gap: 10px; padding: 14px 14px 8px">
        <dc-import name="Hex" family="green" h="{{ 44 }}" icon="back" label="" sub="" hint-size="38px,44px"></dc-import>
        <div><p class="eb" style="font-size: 12px">RUNVORBEREITUNG</p><h2 class="t1" style="font-size: 26px">Run vorbereiten</h2></div>
      </header>
      <div style="flex: 1; overflow: hidden; padding: 4px 14px; display: flex; flex-direction: column; gap: 12px">
        <h3 class="h3" style="font-size: 17px">Schwierigkeit</h3>
        <div role="radiogroup" style="display: flex; border-radius: 10px; border: 1.5px solid #3d5a46; overflow: hidden; font-size: 15px; font-weight: 700">
          <span style="flex: 1; display: flex; align-items: center; justify-content: center; min-height: 44px; background: #f3c94c; color: #2a1f10">Stufe 1 · Standard</span>
          <span style="flex: 1; display: flex; align-items: center; justify-content: center; gap: 4px; min-height: 44px; color: #c9d2cc"><dc-import name="Icon" glyph="lock" size="{{ 14 }}" fill="currentColor" hint-size="14px,14px"></dc-import>Stufe 2</span>
        </div>
        <h3 class="h3" style="font-size: 17px">Startfestung</h3>
        <div style="display: flex; gap: 8px">
          <sc-for list="{{heroes}}" as="hr" hint-placeholder-count="3">
            <button class="{{hr.cls}}" aria-pressed="{{hr.pressed}}" style="flex: 1; flex-direction: column; gap: 4px; padding: 8px 4px; text-align: center">
              <dc-import name="Hex" family="{{hr.family}}" h="{{ 40 }}" icon="base" label="" sub="" hint-size="35px,40px"></dc-import>
              <b style="font-size: 14px; line-height: 1.1">{{hr.short}}</b><span style="font-size: 12px; color: #cfd9cf">{{hr.mini}}</span>
            </button>
          </sc-for>
        </div>
        <div style="display: flex; align-items: baseline; justify-content: space-between"><h3 class="h3" style="font-size: 17px">Turmauswahl</h3><span style="font-size: 15px; font-weight: 700; color: #f3c94c">5 / 5</span></div>
        <div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px">
          <sc-for list="{{towers}}" as="t" hint-placeholder-count="9">
            <button aria-pressed="{{t.pressed}}" aria-label="{{t.aria}}" style="display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 0; border-radius: 10px; border: {{t.border}}; background: {{t.bg}}; opacity: {{t.op}}">
              <dc-import name="Hex" family="{{t.family}}" state="{{t.state}}" h="{{ 46 }}" icon="{{t.icon}}" icon-color="{{t.color}}" label="" sub="" hint-size="40px,46px"></dc-import>
              <span style="font-size: 12px; font-weight: 700; line-height: 1.1">{{t.short}}</span>
            </button>
          </sc-for>
        </div>
        <button style="display: flex; align-items: center; justify-content: space-between; min-height: 44px; padding: 0 12px; border-radius: 10px; border: 1px solid #3d5a46; background: rgba(0, 0, 0, 0.2); font-size: 16px; font-weight: 700">Vorlagen (3)<dc-import name="Icon" glyph="chevronDown" size="{{ 18 }}" fill="#e9dcb8" hint-size="18px,18px"></dc-import></button>
      </div>
      <footer style="padding: 10px 14px 16px; display: flex; flex-direction: column; gap: 8px; background: linear-gradient(180deg, rgba(13, 26, 19, 0), #0d1a13 30%)">
        <button class="btn gold" style="font-size: 17px">Run starten · 5 Türme</button>
      </footer>
    </section>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1970,"height":1020}}'>
class Component extends DCLogic {
  renderVals() {
    const hero = (name, short, desc, mini, sel) => ({ name, short, desc, mini, cls: sel ? 'opt sel' : 'opt', pressed: sel ? 'true' : 'false', family: sel ? 'gold' : 'green' });
    const tw = (icon, name, short, state, color) => {
      const sel = state === 'sel', lock = state === 'lock';
      return { icon: lock ? 'lock' : icon, name, short, color: lock ? '' : (color || ''), family: lock ? 'fog' : 'green', state: sel ? 'selected' : 'normal', check: sel, pressed: sel ? 'true' : 'false',
        border: sel ? '2px solid #f3c94c' : lock ? '1.5px dashed #56625b' : '1.5px solid #3d5a46', bg: sel ? '#1f3a27' : '#13261c', op: lock ? 0.8 : 1,
        note: sel ? 'gewählt' : lock ? 'Arsenal' : 'verfügbar', aria: name + (sel ? ', gewählt' : lock ? ', im Arsenal freischalten' : ', verfügbar') };
    };
    return {
      heroes: [
        hero('Standardfestung', 'Standard', '20 HP · 70 Gold. Ausgewogener Start.', '20 HP · 70 G', true),
        hero('Festungsbauer', 'Baumeister', '20 HP · 55 Gold. Base-Upgrades 25 % günstiger.', '20 HP · 55 G', false),
        hero('Händlerstadt', 'Händler', '15 HP · 90 Gold · +2 Gold je überlebter Wave.', '15 HP · 90 G', false)
      ],
      towers: [
        tw('tower_archer', 'Bogen­schütze', 'Bogen', 'sel'), tw('tower_catapult', 'Katapult', 'Katapult', 'sel'), tw('tower_chain', 'Ketten­blitz', 'Kette', 'sel', '#ffd36a'),
        tw('tower_freeze', 'Frost', 'Frost', 'sel', '#9fe4ff'), tw('tower_flame', 'Flamme', 'Flamme', 'sel', '#ff9a5a'), tw('tower_mine', 'Minen­leger', 'Minen', 'free'),
        tw('tower_ballista', 'Balliste', 'Balliste', 'free'), tw('tower_element', 'Element', 'Element', 'lock'), tw('tower_necromancer', 'Nekro­mant', 'Nekro', 'lock')
      ],
      presets: [
        { name: 'Feuer und Eis', towers: 'Bogen · Frost · Flamme · Kette · Katapult' },
        { name: 'Fernkampf', towers: 'Bogen · Balliste · Katapult · Kette · Frost' },
        { name: 'Minenfeld', towers: 'Minen · Frost · Bogen · Flamme · Katapult' }
      ]
    };
  }
}
</script>
</body>
</html>
