<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Steam-Grafik</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,900&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="position: relative; width: {{w}}px; height: {{h}}px; overflow: hidden; background: {{bg}}">
  <sc-if value="{{showBoard}}" hint-placeholder-val="{{ true }}">
    <div style="position: absolute; left: 0; top: 0"><dc-import name="Board" w="{{w}}" h="{{h}}" r="{{r}}" cx="{{cx}}" cy="{{cy}}" hint-size="920px,430px"></dc-import></div>
  </sc-if>
  <sc-if value="{{showMenu}}" hint-placeholder-val="{{ false }}">
    <div style="position: absolute; left: 0; top: 0"><dc-import name="Backdrop" w="{{w}}" h="{{h}}" islands="{{menuIslands}}" hint-size="1438px,810px"></dc-import></div>
  </sc-if>
  <div style="position: absolute; inset: 0; background: {{shade}}"></div>
  <sc-if value="{{showLogo}}" hint-placeholder-val="{{ true }}">
    <div style="position: absolute; left: {{lx}}px; top: {{ly}}px"><dc-import name="Wordmark" variant="{{lv}}" width="{{lw}}" hint-size="640px,143px"></dc-import></div>
  </sc-if>
  <sc-if value="{{showIcon}}" hint-placeholder-val="{{ false }}">
    <div style="position: absolute; left: {{ix}}px; top: {{iy}}px; color: #f6e7b8"><dc-import name="Hex" family="green" state="selected" h="{{ih}}" icon="base" icon-color="#f6e7b8" label="" sub="" hint-size="220px,254px"></dc-import></div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"kind":{"editor":"enum","default":"header","options":["header","small","main","vertical","library","hero","logo","pageBg","appIcon","community"]},"$preview":{"width":920,"height":430}}'>
class Component extends DCLogic {
  renderVals() {
    // Steam-Formate. Logo-Fläche bekommt einen dunklen Verlauf, damit die Wortmarke auf dem hellen Spielfeld lesbar bleibt.
    const K = {
      header: { w: 920, h: 430, r: 46, cx: 600, cy: 250, lw: 520, lx: 30, ly: 40, lv: 'full', shade: 'linear-gradient(90deg, rgba(10,24,16,0.85) 0%, rgba(10,24,16,0.35) 55%, rgba(10,24,16,0) 80%)' },
      small: { w: 462, h: 174, r: 26, cx: 340, cy: 110, lw: 300, lx: 14, ly: 46, lv: 'full', shade: 'linear-gradient(90deg, rgba(10,24,16,0.88) 0%, rgba(10,24,16,0.4) 60%, rgba(10,24,16,0.05) 100%)' },
      main: { w: 1232, h: 706, r: 64, cx: 700, cy: 420, lw: 640, lx: 296, ly: 36, lv: 'full', shade: 'linear-gradient(180deg, rgba(10,24,16,0.82) 0%, rgba(10,24,16,0.2) 32%, rgba(10,24,16,0) 60%, rgba(10,24,16,0.35) 100%)' },
      vertical: { w: 748, h: 896, r: 48, cx: 374, cy: 560, lw: 560, lx: 94, ly: 56, lv: 'full', shade: 'linear-gradient(180deg, rgba(10,24,16,0.88) 0%, rgba(10,24,16,0.25) 30%, rgba(10,24,16,0) 55%, rgba(10,24,16,0.4) 100%)' },
      library: { w: 600, h: 900, r: 40, cx: 300, cy: 580, lw: 480, lx: 60, ly: 60, lv: 'full', shade: 'linear-gradient(180deg, rgba(10,24,16,0.9) 0%, rgba(10,24,16,0.25) 30%, rgba(10,24,16,0) 55%, rgba(10,24,16,0.45) 100%)' },
      hero: { w: 3840, h: 1240, r: 120, cx: 1920, cy: 640, logo: false, shade: 'radial-gradient(ellipse 70% 90% at 50% 50%, rgba(0,0,0,0) 60%, rgba(10,24,16,0.45) 100%)' },
      logo: { w: 1280, h: 720, board: false, lw: 1100, lx: 90, ly: 262, lv: 'full', bg: 'transparent', shade: 'transparent' },
      pageBg: { w: 1438, h: 810, board: false, menu: true, logo: false, bg: '#0a100c', shade: 'rgba(5,10,7,0.35)' },
      appIcon: { w: 256, h: 256, board: false, logo: false, icon: true, ih: 248, bg: 'transparent', shade: 'transparent' },
      community: { w: 184, h: 184, board: false, logo: false, icon: true, ih: 178, bg: 'transparent', shade: 'transparent' }
    };
    const k = K[this.props.kind] || K.header;
    const ih = k.ih || 0;
    return {
      w: k.w, h: k.h, r: k.r || 40, cx: k.cx || k.w / 2, cy: k.cy || k.h / 2,
      bg: k.bg || '#3f97cf', shade: k.shade,
      showBoard: k.board !== false, showMenu: !!k.menu, menuIslands: true,
      showLogo: k.logo !== false && !!k.lw, lw: k.lw || 0, lx: k.lx || 0, ly: k.ly || 0, lv: k.lv || 'full',
      showIcon: !!k.icon, ih, ix: Math.round((k.w - ih * 0.866) / 2), iy: Math.round((k.h - ih) / 2)
    };
  }
}
</script>
</body>
</html>
