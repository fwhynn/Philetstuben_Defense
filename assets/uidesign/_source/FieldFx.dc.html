<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Spielfeld-Markierung</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<svg viewBox="0 0 256 256" width="{{size}}" height="{{size}}" role="img" aria-label="{{alt}}" style="display: block; overflow: visible">
  <defs>
    <clipPath id="fx-hex"><polygon points="128,10 230.2,69 230.2,187 128,246 25.8,187 25.8,69"></polygon></clipPath>
  </defs>
  <path d="{{l0.d}}" fill="{{l0.f}}" opacity="{{l0.o}}" stroke="{{l0.s}}" stroke-width="{{l0.w}}" stroke-dasharray="{{l0.da}}" stroke-linejoin="round" stroke-linecap="round" clip-path="{{l0.c}}"></path>
  <path d="{{l1.d}}" fill="{{l1.f}}" opacity="{{l1.o}}" stroke="{{l1.s}}" stroke-width="{{l1.w}}" stroke-dasharray="{{l1.da}}" stroke-linejoin="round" stroke-linecap="round" clip-path="{{l1.c}}"></path>
  <path d="{{l2.d}}" fill="{{l2.f}}" opacity="{{l2.o}}" stroke="{{l2.s}}" stroke-width="{{l2.w}}" stroke-dasharray="{{l2.da}}" stroke-linejoin="round" stroke-linecap="round" clip-path="{{l2.c}}"></path>
  <path d="{{l3.d}}" fill="{{l3.f}}" opacity="{{l3.o}}" stroke="{{l3.s}}" stroke-width="{{l3.w}}" stroke-dasharray="{{l3.da}}" stroke-linejoin="round" stroke-linecap="round" clip-path="{{l3.c}}"></path>
  <path d="{{l4.d}}" fill="{{l4.f}}" opacity="{{l4.o}}" stroke="{{l4.s}}" stroke-width="{{l4.w}}" stroke-dasharray="{{l4.da}}" stroke-linejoin="round" stroke-linecap="round" clip-path="{{l4.c}}"></path>
  <path d="{{l5.d}}" fill="{{l5.f}}" opacity="{{l5.o}}" stroke="{{l5.s}}" stroke-width="{{l5.w}}" stroke-dasharray="{{l5.da}}" stroke-linejoin="round" stroke-linecap="round" clip-path="{{l5.c}}"></path>
</svg>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"kind":{"editor":"enum","default":"selectTower","options":["selectTower","selectSlot","range","placeValid","placeInvalid","dragGhost","target"]},"size":{"editor":"int","default":128,"min":24,"max":512},"$preview":{"width":128,"height":128}}'>
class Component extends DCLogic {
  renderVals() {
    // Draufsicht 256 × 256, spitze Hex-Form mit Radius 118. Die 3D-Kamera übernimmt die Schräge.
    const f = (n) => Math.round(n * 10) / 10;
    const P = (pts) => 'M' + pts.map((p) => f(p[0]) + ' ' + f(p[1])).join('L') + 'Z';
    const hex = (r) => P(Array.from({ length: 6 }, (_, i) => { const a = -Math.PI / 2 + i * Math.PI / 3; return [128 + Math.cos(a) * r, 128 + Math.sin(a) * r]; }));
    const circ = (r) => 'M' + f(128 - r) + ' 128a' + r + ' ' + r + ' 0 1 0 ' + 2 * r + ' 0a' + r + ' ' + r + ' 0 1 0 ' + -2 * r + ' 0Z';
    const L = (d, f2, o, s, w, da, c) => ({ d, f: f2, o: o == null ? 1 : o, s: s || 'none', w: w || 0, da: da || 'none', c: c || 'none' });
    const kind = this.props.kind || 'selectTower';
    const corner = (r, len) => Array.from({ length: 6 }, (_, i) => {
      const a = -Math.PI / 2 + i * Math.PI / 3, x = 128 + Math.cos(a) * r, y = 128 + Math.sin(a) * r;
      const a1 = a + Math.PI * 2 / 3, a2 = a - Math.PI * 2 / 3;
      return 'M' + f(x + Math.cos(a1) * len) + ' ' + f(y + Math.sin(a1) * len) + 'L' + f(x) + ' ' + f(y) + 'L' + f(x + Math.cos(a2) * len) + ' ' + f(y + Math.sin(a2) * len);
    }).join(' ');
    let layers = [], alt = '';
    if (kind === 'selectTower') {
      alt = 'Auswahlring Turm';
      layers = [L(hex(112), '#ffd04a', 0.16), L(hex(112), 'none', 1, '#ffd04a', 7), L(corner(124, 30), 'none', 1, '#fff3c4', 9)];
    }
    if (kind === 'selectSlot') {
      alt = 'Auswahlring Bauplatz';
      layers = [L(hex(110), '#ffffff', 0.1), L(hex(110), 'none', 0.95, '#ffffff', 6, '16 12'), L('M128 104V152M104 128H152', 'none', 0.9, '#ffffff', 8)];
    }
    if (kind === 'range') {
      alt = 'Reichweitenkreis';
      layers = [L(circ(124), '#ffffff', 0.12), L(circ(124), 'none', 0.85, '#ffffff', 4, '14 10'), L(circ(118), 'none', 0.35, '#ffffff', 2)];
    }
    if (kind === 'placeValid') {
      alt = 'Vorschau gültig';
      layers = [L(hex(116), '#7fe08a', 0.3), L(hex(116), 'none', 1, '#7fe08a', 8), L(hex(100), 'none', 0.6, '#d8f5d8', 3)];
    }
    if (kind === 'placeInvalid') {
      let stripes = '';
      for (let x = -256; x < 512; x += 36) stripes += P([[x, 0], [x + 16, 0], [x + 16 + 256, 256], [x + 256, 256]]);
      alt = 'Vorschau ungültig';
      layers = [L(hex(116), '#ff6a5a', 0.24), L(stripes, '#ff6a5a', 0.35, 'none', 0, 'none', 'url(#fx-hex)'), L(hex(116), 'none', 1, '#ff6a5a', 8)];
    }
    if (kind === 'dragGhost') {
      alt = 'Turm-Geist beim Ziehen';
      layers = [L(circ(70), '#ffffff', 0.28), L(circ(70), 'none', 0.9, '#ffffff', 5, '12 9'), L(hex(116), 'none', 0.6, '#ffffff', 3, '6 10'), L('M128 70V40M116 52L128 40L140 52', 'none', 0.9, '#ffffff', 6)];
    }
    if (kind === 'target') {
      alt = 'Ziel für Verbrauchshilfe';
      const chev = [0, 90, 180, 270].map((d) => {
        const a = d * Math.PI / 180, c = Math.cos(a), s = Math.sin(a);
        const pt = (x, y) => [128 + x * c - y * s, 128 + x * s + y * c];
        return P([pt(-14, -112), pt(14, -112), pt(0, -86)]);
      }).join('');
      layers = [L(circ(84), '#ff8a5a', 0.14), L(circ(84), 'none', 1, '#ffb36a', 6), L(chev, '#ffe08a', 1), L(circ(10), '#ffe08a', 1)];
    }
    const out = { size: this.props.size ?? 128, alt, layers };
    for (let i = 0; i < 6; i++) out['l' + i] = layers[i] || L('', 'none');
    return out;
  }
}
</script>
</body>
</html>
