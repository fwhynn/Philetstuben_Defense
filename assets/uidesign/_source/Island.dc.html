<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Diorama-Hexinsel</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="position: relative; font-family: Inter, system-ui, sans-serif; color: #f6f2e4">
  <sc-if value="{{isIsland}}" hint-placeholder-val="{{ true }}">
    <div aria-hidden="true" style="position: relative; width: {{w}}px; height: {{h}}px; transform: scaleX({{sx}}); filter: brightness({{dim}})">
      <svg viewBox="0 0 600 820" width="{{w}}" height="{{h}}" style="position: absolute; left: 0; top: 0; overflow: visible">
        <path d="{{g.rockL}}" fill="{{g.rockLFill}}"></path>
        <path d="{{g.rockR}}" fill="{{g.rockRFill}}"></path>
        <path d="{{g.ledges}}" fill="{{c.ledge}}"></path>
        <path d="{{g.earthL}}" fill="{{g.earthLFill}}"></path>
        <path d="{{g.earthR}}" fill="{{g.earthRFill}}"></path>
        <path d="{{g.lips}}" fill="{{c.lip}}"></path>
        <path d="{{g.drips}}" fill="{{c.drip}}"></path>
        <path d="{{g.topA}}" fill="{{c.top1}}"></path>
        <path d="{{g.topB}}" fill="{{c.top2}}"></path>
        <path d="{{g.road}}" fill="none" stroke="{{c.roadEdge}}" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"></path>
        <path d="{{g.road}}" fill="none" stroke="{{c.road}}" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"></path>
        <path d="{{g.river}}" fill="none" stroke="{{c.waterDeep}}" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"></path>
        <path d="{{g.river}}" fill="none" stroke="{{c.water}}" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"></path>
        <path d="{{g.river}}" fill="none" stroke="{{c.foam}}" stroke-width="3" stroke-dasharray="10 22" stroke-linecap="round" opacity="0.7"></path>
        <path d="{{g.fall}}" fill="none" stroke="{{c.water}}" stroke-width="26" stroke-linecap="butt"></path>
        <path d="{{g.fallLines}}" fill="none" stroke="{{c.foam}}" stroke-width="3" opacity="0.75"></path>
        <path d="{{g.foam}}" fill="{{c.foam}}" opacity="0.7"></path>
      </svg>
      <sc-for list="{{decos}}" as="o" hint-placeholder-count="20">
        <svg viewBox="{{o.vb}}" width="{{o.pw}}" height="{{o.ph}}" style="position: absolute; left: {{o.left}}px; top: {{o.top}}px; overflow: visible">
          <path d="{{o.l0.d}}" fill="{{o.l0.f}}" opacity="{{o.l0.o}}" stroke="{{o.l0.s}}" stroke-width="{{o.l0.w}}" stroke-linecap="round" stroke-linejoin="round"></path>
          <path d="{{o.l1.d}}" fill="{{o.l1.f}}" opacity="{{o.l1.o}}" stroke="{{o.l1.s}}" stroke-width="{{o.l1.w}}" stroke-linecap="round" stroke-linejoin="round"></path>
          <path d="{{o.l2.d}}" fill="{{o.l2.f}}" opacity="{{o.l2.o}}" stroke="{{o.l2.s}}" stroke-width="{{o.l2.w}}" stroke-linecap="round" stroke-linejoin="round"></path>
          <path d="{{o.l3.d}}" fill="{{o.l3.f}}" opacity="{{o.l3.o}}" stroke="{{o.l3.s}}" stroke-width="{{o.l3.w}}" stroke-linecap="round" stroke-linejoin="round"></path>
          <path d="{{o.l4.d}}" fill="{{o.l4.f}}" opacity="{{o.l4.o}}" stroke="{{o.l4.s}}" stroke-width="{{o.l4.w}}" stroke-linecap="round" stroke-linejoin="round"></path>
          <path d="{{o.l5.d}}" fill="{{o.l5.f}}" opacity="{{o.l5.o}}" stroke="{{o.l5.s}}" stroke-width="{{o.l5.w}}" stroke-linecap="round" stroke-linejoin="round"></path>
          <path d="{{o.l6.d}}" fill="{{o.l6.f}}" opacity="{{o.l6.o}}" stroke="{{o.l6.s}}" stroke-width="{{o.l6.w}}" stroke-linecap="round" stroke-linejoin="round"></path>
          <path d="{{o.l7.d}}" fill="{{o.l7.f}}" opacity="{{o.l7.o}}" stroke="{{o.l7.s}}" stroke-width="{{o.l7.w}}" stroke-linecap="round" stroke-linejoin="round"></path>
          <path d="{{o.l8.d}}" fill="{{o.l8.f}}" opacity="{{o.l8.o}}" stroke="{{o.l8.s}}" stroke-width="{{o.l8.w}}" stroke-linecap="round" stroke-linejoin="round"></path>
          <path d="{{o.l9.d}}" fill="{{o.l9.f}}" opacity="{{o.l9.o}}" stroke="{{o.l9.s}}" stroke-width="{{o.l9.w}}" stroke-linecap="round" stroke-linejoin="round"></path>
          <path d="{{o.l10.d}}" fill="{{o.l10.f}}" opacity="{{o.l10.o}}" stroke="{{o.l10.s}}" stroke-width="{{o.l10.w}}" stroke-linecap="round" stroke-linejoin="round"></path>
          <path d="{{o.l11.d}}" fill="{{o.l11.f}}" opacity="{{o.l11.o}}" stroke="{{o.l11.s}}" stroke-width="{{o.l11.w}}" stroke-linecap="round" stroke-linejoin="round"></path>
          <path d="{{o.l12.d}}" fill="{{o.l12.f}}" opacity="{{o.l12.o}}" stroke="{{o.l12.s}}" stroke-width="{{o.l12.w}}" stroke-linecap="round" stroke-linejoin="round"></path>
          <path d="{{o.l13.d}}" fill="{{o.l13.f}}" opacity="{{o.l13.o}}" stroke="{{o.l13.s}}" stroke-width="{{o.l13.w}}" stroke-linecap="round" stroke-linejoin="round"></path>
        </svg>
      </sc-for>
    </div>
  </sc-if>
  <sc-if value="{{isCatalog}}" hint-placeholder-val="{{ false }}">
    <div style="display: grid; grid-template-columns: repeat({{cols}}, minmax(0, 1fr)); gap: 10px; width: {{catW}}px">
      <sc-for list="{{catalog}}" as="o" hint-placeholder-count="20">
        <figure style="margin: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 6px 8px; border-radius: 12px; background: {{cardBg}}; border: 1px solid #2f4a3a">
          <div style="height: {{cellH}}px; display: flex; align-items: flex-end; justify-content: center">
            <svg viewBox="{{o.vb}}" width="{{o.pw}}" height="{{o.ph}}" role="img" aria-label="{{o.label}}" style="overflow: visible">
              <path d="{{o.l0.d}}" fill="{{o.l0.f}}" opacity="{{o.l0.o}}" stroke="{{o.l0.s}}" stroke-width="{{o.l0.w}}" stroke-linecap="round" stroke-linejoin="round"></path>
              <path d="{{o.l1.d}}" fill="{{o.l1.f}}" opacity="{{o.l1.o}}" stroke="{{o.l1.s}}" stroke-width="{{o.l1.w}}" stroke-linecap="round" stroke-linejoin="round"></path>
              <path d="{{o.l2.d}}" fill="{{o.l2.f}}" opacity="{{o.l2.o}}" stroke="{{o.l2.s}}" stroke-width="{{o.l2.w}}" stroke-linecap="round" stroke-linejoin="round"></path>
              <path d="{{o.l3.d}}" fill="{{o.l3.f}}" opacity="{{o.l3.o}}" stroke="{{o.l3.s}}" stroke-width="{{o.l3.w}}" stroke-linecap="round" stroke-linejoin="round"></path>
              <path d="{{o.l4.d}}" fill="{{o.l4.f}}" opacity="{{o.l4.o}}" stroke="{{o.l4.s}}" stroke-width="{{o.l4.w}}" stroke-linecap="round" stroke-linejoin="round"></path>
              <path d="{{o.l5.d}}" fill="{{o.l5.f}}" opacity="{{o.l5.o}}" stroke="{{o.l5.s}}" stroke-width="{{o.l5.w}}" stroke-linecap="round" stroke-linejoin="round"></path>
              <path d="{{o.l6.d}}" fill="{{o.l6.f}}" opacity="{{o.l6.o}}" stroke="{{o.l6.s}}" stroke-width="{{o.l6.w}}" stroke-linecap="round" stroke-linejoin="round"></path>
              <path d="{{o.l7.d}}" fill="{{o.l7.f}}" opacity="{{o.l7.o}}" stroke="{{o.l7.s}}" stroke-width="{{o.l7.w}}" stroke-linecap="round" stroke-linejoin="round"></path>
              <path d="{{o.l8.d}}" fill="{{o.l8.f}}" opacity="{{o.l8.o}}" stroke="{{o.l8.s}}" stroke-width="{{o.l8.w}}" stroke-linecap="round" stroke-linejoin="round"></path>
              <path d="{{o.l9.d}}" fill="{{o.l9.f}}" opacity="{{o.l9.o}}" stroke="{{o.l9.s}}" stroke-width="{{o.l9.w}}" stroke-linecap="round" stroke-linejoin="round"></path>
              <path d="{{o.l10.d}}" fill="{{o.l10.f}}" opacity="{{o.l10.o}}" stroke="{{o.l10.s}}" stroke-width="{{o.l10.w}}" stroke-linecap="round" stroke-linejoin="round"></path>
              <path d="{{o.l11.d}}" fill="{{o.l11.f}}" opacity="{{o.l11.o}}" stroke="{{o.l11.s}}" stroke-width="{{o.l11.w}}" stroke-linecap="round" stroke-linejoin="round"></path>
              <path d="{{o.l12.d}}" fill="{{o.l12.f}}" opacity="{{o.l12.o}}" stroke="{{o.l12.s}}" stroke-width="{{o.l12.w}}" stroke-linecap="round" stroke-linejoin="round"></path>
              <path d="{{o.l13.d}}" fill="{{o.l13.f}}" opacity="{{o.l13.o}}" stroke="{{o.l13.s}}" stroke-width="{{o.l13.w}}" stroke-linecap="round" stroke-linejoin="round"></path>
            </svg>
          </div>
          <figcaption style="display: flex; flex-direction: column; align-items: center; gap: 1px; text-align: center">
            <b style="font-size: 13px">{{o.label}}</b>
            <code style="font-size: 12px; color: #9fb3a6">{{o.file}}</code>
          </figcaption>
        </figure>
      </sc-for>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","default":"island","options":["island","catalog"]},"variant":{"editor":"enum","default":"a","options":["a","b"]},"edition":{"editor":"enum","default":"base","options":["base","sakura","halloween"]},"scale":{"editor":"float","default":1,"min":0.2,"max":2,"step":0.05},"mirror":{"editor":"boolean","default":false},"dim":{"editor":"range","default":0.95,"min":0.4,"max":1.2,"step":0.05},"cols":{"editor":"int","default":7,"min":2,"max":10},"catW":{"editor":"int","default":1100,"min":300,"max":2400},"$preview":{"width":600,"height":820}}'>
class Component extends DCLogic {
  renderVals() {
    const mode = this.props.mode === 'catalog' ? 'catalog' : 'island';
    const variant = this.props.variant === 'b' ? 'b' : 'a';
    const scale = this.props.scale ?? 1;
    const mirror = !!this.props.mirror;
    const ed = ['sakura', 'halloween'].includes(this.props.edition) ? this.props.edition : 'base';
    // Licht kommt immer von vorne rechts (Bildschirm). Gespiegelte Inseln tauschen deshalb die beleuchtete Seite.
    const LS = mirror ? -1 : 1;
    const f = (n) => Math.round(n * 10) / 10;
    const P = (pts) => 'M' + pts.map((p) => f(p[0]) + ' ' + f(p[1])).join('L') + 'Z';
    const E = (x, y, rx, ry) => 'M' + f(x - rx) + ' ' + f(y) + 'a' + f(rx) + ' ' + f(ry) + ' 0 1 0 ' + f(2 * rx) + ' 0a' + f(rx) + ' ' + f(ry) + ' 0 1 0 ' + f(-2 * rx) + ' 0Z';
    const C = (x, y, r) => E(x, y, r, r);
    const base = {
      top1: '#7aac50', top2: '#6c9d48', lip: '#4f7f38', drip: '#46732f', earthLit: '#8a6440', earthDark: '#5e4129', rockLit: '#9a9d92', rockDark: '#5f645d', ledge: '#b9bcb0',
      road: '#e0bc86', roadEdge: '#a87a45', water: '#4fa3c8', waterDeep: '#2f6f93', foam: '#e8f6fb',
      pineDark: '#2f6438', pineLit: '#4f8a45', crownDark: '#3d7a3a', crownLit: '#5e9a4a', crownHi: '#86b85c', bushDark: '#3f7536', bushLit: '#5f9a48',
      grass: '#4f7a36', grassLit: '#73a650', flowers: ['#f2d34f', '#f6f2e4', '#e88aa6'], trunk: '#5a3d25', wood: '#8a6440', woodDark: '#5e4129',
      banner: '#2f4f8f', bannerLit: '#4065a8', crest: '#f3d58a', flame: '#ffb347', flameCore: '#fff1a8', glow: '255,184,90', lamp: '#ffd27a', lampBody: '#2b2116',
      stone: '#cfc6b3', stoneDark: '#9d9481', stoneTop: '#bdb4a0'
    };
    const PAL = {
      base,
      sakura: Object.assign({}, base, { crownDark: '#c9688a', crownLit: '#ee9cb6', crownHi: '#ffd0de', bushDark: '#c76a8a', bushLit: '#ef9fb8', flowers: ['#ffc4d6', '#ffe3ec', '#f590b0'], banner: '#f4ecd6', bannerLit: '#fffaf0', crest: '#d9493a', lamp: '#ffb0a0', lampBody: '#d9493a', glow: '255,150,140' }),
      halloween: Object.assign({}, base, { top1: '#6a8a48', top2: '#5d7a40', lip: '#465f30', drip: '#3d5229', pineDark: '#263f2c', pineLit: '#38583a', grass: '#7a6a38', grassLit: '#9a8a48', flowers: ['#e07b22', '#f2a33a', '#b25a12'], banner: '#4a2c6b', bannerLit: '#5f3a88', crest: '#f08a24', flame: '#9be36a', flameCore: '#e6ffd0', glow: '155,227,106', lamp: '#ffb347', lampBody: '#e07b22' })
    };
    const c = PAL[ed];
    const L = (d, fill, o, s, w) => ({ d, f: fill, o: o == null ? 1 : o, s: s || 'none', w: w || 0 });

    // ---------- Deko-Set: jede Form steht mit dem Fuß auf (0,0) ----------
    const pine = (H) => {
      const out = [L(P([[-0.05 * H, 0], [0.05 * H, 0], [0.05 * H, -0.2 * H], [-0.05 * H, -0.2 * H]]), c.trunk)];
      [[-0.14, -0.56, 0.34], [-0.38, -0.8, 0.27], [-0.6, -1, 0.19]].forEach(([b, a, w]) => {
        out.push(L(P([[0, a * H], [w * H, b * H], [-w * H, b * H]]), c.pineDark));
        out.push(L(P([[0, a * H], [LS * w * H, b * H], [LS * 0.05 * H, b * H]]), c.pineLit));
      });
      return out;
    };
    const crownPts = (cx, cy, R, jit) => [-90, -40, 0, 40, 90, 140, 180, 220].map((a, i) => [cx + Math.cos(a * Math.PI / 180) * R * 1.12 * jit[i], cy + Math.sin(a * Math.PI / 180) * R * jit[i]]);
    const branch = (x0, y0, x1, y1, w) => {
      const dx = x1 - x0, dy = y1 - y0, l = Math.hypot(dx, dy) || 1, nx = -dy / l * w / 2, ny = dx / l * w / 2;
      return P([[x0 + nx, y0 + ny], [x1 + nx * 0.3, y1 + ny * 0.3], [x1 - nx * 0.3, y1 - ny * 0.3], [x0 - nx, y0 - ny]]);
    };
    const leafy = (H, wide) => {
      if (ed === 'halloween') {
        const H2 = H * 0.95;
        return [
          L(P([[-0.07 * H2, 0], [0.07 * H2, 0], [0.03 * H2, -0.62 * H2], [-0.03 * H2, -0.62 * H2]]), '#3b2a22'),
          L(branch(0, -0.4 * H2, -0.32 * H2, -0.82 * H2, 0.05 * H2) + branch(0, -0.5 * H2, 0.3 * H2, -0.86 * H2, 0.05 * H2) + branch(0, -0.6 * H2, 0.04 * H2, -1 * H2, 0.045 * H2), '#3b2a22'),
          L(branch(-0.16 * H2, -0.61 * H2, -0.36 * H2, -0.64 * H2, 0.03 * H2) + branch(0.15 * H2, -0.68 * H2, 0.36 * H2, -0.66 * H2, 0.03 * H2), '#4a3628'),
          L(P([[LS * 0.01 * H2, 0], [LS * 0.07 * H2, 0], [LS * 0.03 * H2, -0.62 * H2]]), '#5a4232')
        ];
      }
      const R = wide ? 0.38 * H : 0.3 * H, cy = -0.62 * H;
      const jit = wide ? [1, 0.9, 1.06, 0.92, 0.96, 0.9, 1.05, 0.94] : [1, 0.95, 1, 0.9, 1, 0.92, 1, 0.96];
      const pts = crownPts(0, cy, R, jit);
      const lit = [[0, cy - R], pts[1], pts[2], pts[3], [0, cy + R * 0.9]].map(([x, y]) => [Math.abs(x) * LS, y]);
      return [
        L(P([[-0.06 * H, 0], [0.06 * H, 0], [0.04 * H, -0.45 * H], [-0.04 * H, -0.45 * H]]), c.trunk),
        L(P(pts), c.crownDark),
        L(P(lit), c.crownLit),
        L(P([[0, cy - R], [LS * R * 0.75, cy - R * 0.5], [LS * R * 0.15, cy - R * 0.15]]), c.crownHi)
      ];
    };
    const bush = (W) => {
      if (ed === 'halloween') {
        return [
          L(E(0, -0.3 * W, 0.42 * W, 0.3 * W), '#d06c1a'),
          L(E(LS * 0.12 * W, -0.3 * W, 0.22 * W, 0.28 * W), '#f29a44'),
          L(E(0, -0.3 * W, 0.12 * W, 0.29 * W), '#b85e16', 0.7),
          L(P([[-0.04 * W, -0.56 * W], [0.04 * W, -0.56 * W], [0.06 * W, -0.72 * W], [0, -0.72 * W]]), '#4f7a36')
        ];
      }
      const blob = (cx, cy, r) => P([[cx - r, cy + r * 0.3], [cx - r * 0.8, cy - r * 0.5], [cx - r * 0.1, cy - r], [cx + r * 0.7, cy - r * 0.7], [cx + r, cy + r * 0.1], [cx + r * 0.6, cy + r * 0.6], [cx - r * 0.5, cy + r * 0.6]]);
      const litBlob = (cx, cy, r) => P([[cx - r * 0.1, cy - r], [cx + LS * r * 0.7, cy - r * 0.7], [cx + LS * r, cy + r * 0.1], [cx + LS * r * 0.3, cy]]);
      return [
        L(blob(-0.2 * W, -0.32 * W, 0.34 * W) + blob(0.22 * W, -0.28 * W, 0.3 * W), c.bushDark),
        L(litBlob(-0.2 * W, -0.32 * W, 0.34 * W) + litBlob(0.22 * W, -0.28 * W, 0.3 * W), c.bushLit)
      ];
    };
    const grass = (W) => {
      let a = '', b = '';
      [-0.4, -0.2, 0, 0.2, 0.4].forEach((x, i) => {
        const h = W * [0.5, 0.75, 0.9, 0.65, 0.45][i];
        const tri = P([[x * W - 0.07 * W, 0], [x * W + 0.07 * W, 0], [x * W + LS * (i - 2) * 0.05 * W, -h]]);
        if (i % 2) a += tri; else b += tri;
      });
      return [L(a, c.grass), L(b, c.grassLit)];
    };
    const flowers = (W) => {
      let stems = '';
      const dots = ['', '', ''];
      [[-0.35, 0.5], [-0.1, 0.8], [0.15, 0.6], [0.38, 0.75], [0.0, 0.45]].forEach(([x, h], i) => {
        stems += P([[x * W - 1, 0], [x * W + 1, 0], [x * W + 1, -h * W * 0.6], [x * W - 1, -h * W * 0.6]]);
        dots[i % 3] += C(x * W, -h * W * 0.6, ed === 'halloween' ? 4.5 : 3.5);
      });
      return [L(stems, c.grass), L(dots[0], c.flowers[0]), L(dots[1], c.flowers[1]), L(dots[2], c.flowers[2])];
    };
    const rock = (W, hs, twin) => {
      const one = (ox, w, h) => {
        const S = (pts) => P(pts.map(([x, y]) => [ox + x * w * LS, y * h]));
        return [
          S([[-0.5, 0], [-0.42, -0.42], [-0.1, -0.62], [0.3, -0.55], [0.5, -0.2], [0.45, 0]]),
          S([[-0.1, -0.62], [0.3, -0.55], [0.5, -0.2], [0.45, 0], [0.05, 0], [0, -0.35]]),
          S([[-0.42, -0.42], [-0.1, -0.62], [0.3, -0.55], [0, -0.35]])
        ];
      };
      const a = one(0, W, W * hs);
      const b = twin ? one(LS * 0.48 * W, W * 0.5, W * 0.5 * hs) : ['', '', ''];
      return [L(a[0], c.rockDark), L(a[1], c.rockLit), L(a[2], c.ledge), L(b[0], c.rockDark), L(b[1], c.rockLit), L(b[2], c.ledge)];
    };
    const fence = (W) => {
      let posts = '', rails = '';
      rails += P([[-W / 2, -20], [W / 2, -20], [W / 2, -16], [-W / 2, -16]]) + P([[-W / 2, -10], [W / 2, -10], [W / 2, -6], [-W / 2, -6]]);
      [-0.5, 0, 0.5].forEach((x) => { posts += P([[x * W - 3, 2], [x * W + 3, 2], [x * W + 3, -26], [x * W - 3, -26]]); });
      return [L(rails, c.wood), L(posts, c.woodDark)];
    };
    const torch = (H) => [
      L(C(0, -H - 14, 38), 'rgba(' + c.glow + ',0.12)'),
      L(C(0, -H - 14, 20), 'rgba(' + c.glow + ',0.26)'),
      L(P([[-3, 0], [3, 0], [3, -H], [-3, -H]]), c.woodDark),
      L(P([[-8, -H], [8, -H], [5, -H - 6], [-5, -H - 6]]), '#3a2a1c'),
      L(P([[0, -H - 32], [8, -H - 13], [3, -H - 6], [-3, -H - 6], [-8, -H - 13]]), c.flame),
      L(P([[0, -H - 23], [3.5, -H - 11], [0, -H - 7], [-3.5, -H - 11]]), c.flameCore)
    ];
    const lantern = (H) => {
      const x = LS * 22, y = -H + 34;
      const out = [
        L(C(x, y, 40), 'rgba(' + c.glow + ',0.12)'),
        L(C(x, y, 20), 'rgba(' + c.glow + ',0.28)'),
        L(P([[-3, 0], [3, 0], [3, -H], [-3, -H]]), c.woodDark),
        L(P([[0, -H + 2], [LS * 26, -H + 2], [LS * 26, -H + 7], [0, -H + 7]]), c.woodDark),
        L(P([[x - 0.6, -H + 7], [x + 0.6, -H + 7], [x + 0.6, y - 12], [x - 0.6, y - 12]]), '#2b2116')
      ];
      if (ed === 'sakura') {
        out.push(L(E(x, y, 10, 13), c.lampBody));
        out.push(L(E(x, y, 6, 9), c.lamp));
      } else if (ed === 'halloween') {
        out.push(L(E(x, y, 12, 10), c.lampBody));
        out.push(L(P([[x - 6, y - 3], [x - 2, y - 3], [x - 4, y - 7]]) + P([[x + 2, y - 3], [x + 6, y - 3], [x + 4, y - 7]]) + P([[x - 6, y + 3], [x + 6, y + 3], [x, y + 6]]), c.lamp));
      } else {
        out.push(L(P([[x - 9, y - 12], [x + 9, y - 12], [x, y - 20]]), c.lampBody));
        out.push(L(P([[x - 8, y - 12], [x + 8, y - 12], [x + 8, y + 10], [x - 8, y + 10]]), c.lampBody));
        out.push(L(P([[x - 5, y - 9], [x + 5, y - 9], [x + 5, y + 7], [x - 5, y + 7]]), c.lamp));
      }
      return out;
    };
    const banner = (H) => {
      const X = (pts) => P(pts.map(([px, py]) => [px * LS, py]));
      return [
        L(P([[-2.5, 0], [2.5, 0], [2.5, -H], [-2.5, -H]]), c.woodDark),
        L(X([[-3, -H + 4], [32, -H + 4], [32, -H + 9], [-3, -H + 9]]), c.woodDark),
        L(C(0, -H - 3, 4), c.crest),
        L(X([[5, -H + 9], [30, -H + 9], [30, -H + 58], [17.5, -H + 49], [5, -H + 58]]), c.banner),
        L(X([[17.5, -H + 9], [30, -H + 9], [30, -H + 58], [17.5, -H + 49]]), c.bannerLit),
        L(X([[17.5, -H + 22], [23, -H + 30], [17.5, -H + 38], [12, -H + 30]]), c.crest)
      ];
    };
    const bridge = (W) => {
      let gaps = '';
      for (let x = -W / 2 + 10; x < W / 2 - 4; x += 11) gaps += P([[x, -7], [x + 1.6, -7], [x + 1.6, 3], [x, 3]]);
      let posts = '';
      [-0.5, -0.17, 0.17, 0.5].forEach((x) => { posts += P([[x * W - 2.5, -4], [x * W + 2.5, -4], [x * W + 2.5, -26], [x * W - 2.5, -26]]); });
      return [
        L(E(0, 8, W * 0.46, 7), '#000000', 0.25),
        L(P([[-W / 2, -7], [W / 2, -7], [W / 2, 4], [-W / 2, 4]]), c.wood),
        L(gaps, c.woodDark),
        L(P([[-W / 2, -24], [W / 2, -24], [W / 2, -20], [-W / 2, -20]]), c.wood),
        L(posts, c.woodDark)
      ];
    };
    const tower = (H) => {
      const top = -0.62 * H;
      const X = (pts) => P(pts.map(([px, py]) => [px * LS, py]));
      let bricks = '';
      [[-14, -20], [6, -34], [-8, -52], [10, -66], [-16, -80]].forEach(([bx, by]) => { bricks += P([[bx, by], [bx + 10, by], [bx + 10, by + 3], [bx, by + 3]]); });
      return [
        L(P([[-27, 0], [-23, top], [23, top], [27, 0]]), c.stone),
        L(X([[-27, 0], [-23, top], [-6, top], [-6, 0]]), c.stoneDark),
        L(bricks, c.stoneDark, 0.8),
        L(P([[-28, top + 2], [28, top + 2], [28, top - 16], [19, top - 16], [19, top - 9], [10, top - 9], [10, top - 16], [1, top - 16], [1, top - 9], [-8, top - 9], [-8, top - 16], [-17, top - 16], [-17, top - 9], [-28, top - 9]]), c.stoneTop),
        L(P([[-7, 0], [-7, -16], [0, -22], [7, -16], [7, 0]]), '#3a2a1c'),
        L(C(LS * -2, top + 30, 22), 'rgba(' + c.glow + ',0.22)'),
        L(P([[LS * -6, top + 22], [LS * 2, top + 22], [LS * 2, top + 38], [LS * -6, top + 38]]), c.lamp),
        L(X([[8, top + 4], [22, top + 4], [22, top + 46], [15, top + 40], [8, top + 46]]), c.banner),
        L(X([[15, top + 14], [19, top + 20], [15, top + 26], [11, top + 20]]), c.crest),
        L(P([[-1.2, top - 16], [1.2, top - 16], [1.2, top - 46], [-1.2, top - 46]]), c.woodDark),
        L(X([[1.2, top - 46], [24, top - 39], [1.2, top - 32]]), '#c0453a')
      ];
    };
    // Kacheln im Katalog: Wiesen-Hex in Schrägsicht, r = 50
    const tileMini = (kind) => {
      const r = 50, k = 0.6, a = r * 0.866, tip = r * k, half = tip / 2, cy = -(kind === 'socket' ? 104 : 46);
      const t = kind === 'socket' ? 96 : 30, e = Math.min(t, 26);
      const Lp = [-a, cy + half], M = [0, cy + tip], R = [a, cy + half];
      const face = (p, q, y0, y1) => P([[p[0], p[1] + y0], [q[0], q[1] + y0], [q[0], q[1] + y1], [p[0], p[1] + y1]]);
      const top = [[0, cy - tip], [a, cy - half], R, M, Lp, [-a, cy - half]];
      const fan = (i) => P([[0, cy], top[i], top[(i + 1) % 6]]);
      const out = [
        L(face(Lp, M, e, t), LS > 0 ? c.rockDark : c.rockLit),
        L(face(M, R, e, t), LS > 0 ? c.rockLit : c.rockDark),
        L(face(Lp, M, 0, e), LS > 0 ? c.earthDark : c.earthLit),
        L(face(M, R, 0, e), LS > 0 ? c.earthLit : c.earthDark),
        L(face(Lp, M, 0, 7) + face(M, R, 0, 7), c.lip),
        L(fan(0) + fan(2) + fan(4), c.top1),
        L(fan(1) + fan(3) + fan(5), c.top2)
      ];
      if (kind === 'socket') {
        out.push(L(face([Lp[0] + 10, Lp[1] + 5], [M[0] - 8, M[1] - 1], 52, 58) + face([M[0] + 10, M[1] - 4], [R[0] - 8, R[1] + 2], 44, 50), c.ledge));
        out.push(L(P([[-a + 12, cy + half + 7], [-a + 18, cy + half + 7], [-a + 15, cy + half + 15]]) + P([[-12, cy + tip - 3], [-6, cy + tip - 3], [-9, cy + tip + 6]]) + P([[a - 20, cy + half + 5], [a - 14, cy + half + 5], [a - 17, cy + half + 13]]), c.drip));
      }
      if (kind === 'river_straight') {
        out.push(L('M' + f(-a) + ' ' + f(cy) + 'H' + f(a), 'none', 1, c.waterDeep, 22));
        out.push(L('M' + f(-a) + ' ' + f(cy) + 'H' + f(a), 'none', 1, c.water, 14));
      }
      if (kind === 'river_curve') {
        const d = 'M' + f(-a) + ' ' + f(cy) + 'Q0 ' + f(cy) + ' ' + f(a * 0.5) + ' ' + f(cy + tip * 0.75);
        out.push(L(d, 'none', 1, c.waterDeep, 22));
        out.push(L(d, 'none', 1, c.water, 14));
      }
      if (kind === 'waterfall') {
        const d = 'M' + f(-a) + ' ' + f(cy) + 'Q0 ' + f(cy) + ' 0 ' + f(cy + tip);
        out.push(L(d, 'none', 1, c.waterDeep, 22));
        out.push(L(d + 'V' + f(cy + tip + t + 16), 'none', 1, c.water, 14));
        out.push(L('M-3 ' + f(cy + tip + 2) + 'V' + f(cy + tip + t + 10) + 'M3 ' + f(cy + tip + 8) + 'V' + f(cy + tip + t + 14), 'none', 0.8, c.foam, 1.6));
        out.push(L(E(0, cy + tip + t + 16, 16, 5), c.foam, 0.7));
      }
      return out;
    };
    const KINDS = {
      pine_s: { draw: () => pine(60), bw: 50, bh: 64, label: 'Nadelbaum klein' },
      pine_m: { draw: () => pine(86), bw: 64, bh: 90, label: 'Nadelbaum mittel' },
      pine_l: { draw: () => pine(112), bw: 84, bh: 116, label: 'Nadelbaum groß' },
      tree_a: { draw: () => leafy(80, false), bw: 70, bh: 86, label: ed === 'sakura' ? 'Kirschbaum A' : ed === 'halloween' ? 'Kahler Baum A' : 'Laubbaum A' },
      tree_b: { draw: () => leafy(96, true), bw: 96, bh: 100, label: ed === 'sakura' ? 'Kirschbaum B' : ed === 'halloween' ? 'Kahler Baum B' : 'Laubbaum B' },
      bush: { draw: () => bush(40), bw: 46, bh: 32, label: ed === 'halloween' ? 'Kürbis' : 'Busch' },
      grass: { draw: () => grass(28), bw: 34, bh: 28, label: 'Grasbüschel' },
      flowers: { draw: () => flowers(34), bw: 36, bh: 30, label: ed === 'halloween' ? 'Mini-Kürbisse' : ed === 'sakura' ? 'Blütenblätter' : 'Blumen' },
      rock_a: { draw: () => rock(30, 0.9, false), bw: 34, bh: 30, label: 'Fels klein' },
      rock_b: { draw: () => rock(44, 1.2, false), bw: 48, bh: 56, label: 'Fels hoch' },
      rock_c: { draw: () => rock(52, 0.7, true), bw: 82, bh: 40, label: 'Felsgruppe' },
      fence: { draw: () => fence(60), bw: 68, bh: 30, label: 'Zaunstück' },
      torch: { draw: () => torch(46), bw: 80, bh: 96, label: 'Fackel' },
      lantern: { draw: () => lantern(84), bw: 100, bh: 92, label: ed === 'sakura' ? 'Papierlaterne' : ed === 'halloween' ? 'Kürbislaterne' : 'Laterne' },
      banner: { draw: () => banner(82), bw: 70, bh: 90, label: 'Banner mit Wappen' },
      bridge: { draw: () => bridge(92), bw: 96, bh: 30, label: 'Holzbrücke' },
      tower: { draw: () => tower(150), bw: 70, bh: 150, label: 'Turm (Spielmodell)' },
      river_straight: { draw: () => tileMini('river_straight'), bw: 92, bh: 80, label: 'Bach gerade' },
      river_curve: { draw: () => tileMini('river_curve'), bw: 92, bh: 80, label: 'Bach Kurve' },
      waterfall: { draw: () => tileMini('waterfall'), bw: 92, bh: 80, label: 'Wasserfall-Kante', pad: 46 },
      socket: { draw: () => tileMini('socket'), bw: 92, bh: 138, label: 'Inselsockel (Ausschnitt)', pad: 10 }
    };
    const FILES = { pine_s: 'deco_pine_s', pine_m: 'deco_pine_m', pine_l: 'deco_pine_l', tree_a: 'deco_tree_a', tree_b: 'deco_tree_b', bush: 'deco_bush', grass: 'deco_grass', flowers: 'deco_flowers', rock_a: 'deco_rock_a', rock_b: 'deco_rock_b', rock_c: 'deco_rock_c', fence: 'deco_fence', torch: 'deco_torch', lantern: 'deco_lantern', banner: 'deco_banner', bridge: 'deco_bridge', tower: 'towers/tower_archer', river_straight: 'tile_river_straight', river_curve: 'tile_river_curve', waterfall: 'tile_river_fall', socket: 'island_socket_left' };
    const pack = (kind, extra) => {
      const K = KINDS[kind];
      const layers = K.draw();
      const o = Object.assign({ label: K.label, file: FILES[kind] + '.glb' }, extra || {});
      for (let i = 0; i < 14; i++) o['l' + i] = layers[i] || { d: '', f: 'none', o: 1, s: 'none', w: 0 };
      const pad = K.pad || 6;
      o.vb = f(-K.bw / 2) + ' ' + f(-K.bh) + ' ' + K.bw + ' ' + (K.bh + pad);
      o.bw = K.bw; o.bh = K.bh; o.pad = pad;
      return o;
    };

    if (mode === 'catalog') {
      const order = ['pine_s', 'pine_m', 'pine_l', 'tree_a', 'tree_b', 'bush', 'grass', 'flowers', 'rock_a', 'rock_b', 'rock_c', 'fence', 'torch', 'lantern', 'banner', 'bridge', 'river_straight', 'river_curve', 'waterfall', 'socket'];
      const cellH = 104;
      const catalog = order.map((k) => {
        const o = pack(k);
        const s = Math.min(cellH / (o.bh + o.pad), 1.15);
        o.pw = f(o.bw * s); o.ph = f((o.bh + o.pad) * s);
        return o;
      });
      return { isIsland: false, isCatalog: true, catalog, cols: this.props.cols ?? 7, catW: this.props.catW ?? 1100, cellH, cardBg: ed === 'halloween' ? '#1e1a22' : ed === 'sakura' ? '#24262a' : '#1a2d24', w: 0, h: 0, sx: 1, dim: 1, g: {}, c, decos: [] };
    }

    // ---------- Insel ----------
    const r = 78, k = 0.6, a = r * 0.866, tip = r * k, half = tip / 2, s = 0.95;
    const x0 = 20, y0 = 120, dx = 2 * a, dy = 1.5 * tip, eu = 36;
    const ISL = {
      a: {
        tiles: [[0,0,1],[1,0,1],[0,1,1],[1,1,0.5],[2,1,0],[0,2,0.5],[1,2,0],[2,2,0],[3,2,-0.3],[0,3,0],[1,3,0],[2,3,0],[3,3,-0.3],[0,4,0],[1,4,0],[2,4,-0.2],[0,5,-0.2],[1,5,-0.2],[2,5,-0.4],[0,6,-0.4],[1,6,-0.4],[2,6,-0.5],[0,7,-0.6]],
        roads: [[[0,1],[1,2],[1,3],[2,4],[2,5],[2,6]]],
        river: [[0,3],[0,4],[0,5],[0,6],[0,7]],
        decos: [['tower',0,0,0,8],['torch',0,0,44,16],['pine_l',1,0,-12,-6],['pine_m',1,0,30,10],['pine_m',0,1,-40,-4],['grass',0,1,30,14],['pine_s',1,1,-24,-8],['grass',1,1,24,10],
          ['tree_a',2,1,0,0],['bush',2,1,36,14],['pine_s',0,2,-30,4],['rock_b',0,2,24,-6],['fence',1,2,-30,22],['grass',1,2,32,-12],['pine_l',2,2,10,-4],['flowers',2,2,-32,14],
          ['pine_m',3,2,0,-2],['grass',3,2,-30,12],['grass',0,3,-40,-2],['fence',1,3,30,-16],['rock_a',2,3,-8,0],['flowers',2,3,30,12],['pine_l',3,3,-4,0],['pine_s',3,3,30,16],
          ['rock_c',0,4,34,-4],['tree_b',1,4,0,2],['bush',1,4,-36,14],['grass',2,4,32,0],['bridge',0,5,0,2],['pine_m',1,5,-10,-2],['flowers',1,5,30,10],['rock_a',2,5,30,-4],
          ['pine_s',1,6,-14,0],['rock_a',1,6,22,8],['grass',2,6,28,6],['flowers',0,6,30,-14]]
      },
      b: {
        tiles: [[0,0,0.6],[0,1,0.6],[1,1,0.3],[0,2,0.2],[1,2,0],[2,2,0],[0,3,0],[1,3,0],[2,3,0],[3,3,-0.2],[0,4,0],[1,4,0],[2,4,-0.2],[0,5,-0.3],[1,5,-0.3],[2,5,-0.4],[0,6,-0.5],[1,6,-0.5]],
        roads: [[[0,2],[0,3],[1,3],[2,3]], [[1,3],[1,4],[1,5],[1,6]]],
        river: [[0,5],[1,5],[2,5]],
        riverIn: true,
        decos: [['pine_l',0,0,-6,-4],['pine_m',0,0,32,12],['pine_m',0,1,-28,-4],['tree_a',1,1,8,0],['bush',1,1,-30,14],['grass',0,2,-40,0],['rock_b',1,2,0,-2],['grass',1,2,34,10],
          ['pine_s',2,2,0,-4],['flowers',2,2,-30,12],['fence',0,3,-6,-26],['banner',2,3,-30,-10],['lantern',2,3,26,-6],['pine_l',3,3,-2,0],['pine_s',3,3,30,16],['tree_b',0,4,0,0],
          ['fence',1,4,36,0],['rock_a',2,4,-10,0],['pine_m',2,4,30,8],['rock_c',0,5,-26,-16],['bridge',1,5,0,2],['grass',2,5,-30,-14],['pine_m',0,6,0,-2],['flowers',0,6,32,10],['grass',1,6,34,4]]
      }
    };
    const I = ISL[variant];
    const elevOf = {};
    I.tiles.forEach(([cc, rr, el]) => { elevOf[cc + ',' + rr] = el; });
    const center = (cc, rr) => [x0 + cc * dx + (rr % 2) * a, y0 + rr * dy - (elevOf[cc + ',' + rr] || 0) * eu];
    let jitSeed = variant === 'a' ? 11 : 23;
    const rnd = () => { jitSeed = (jitSeed * 9301 + 49297) % 233280; return jitSeed / 233280; };
    const g = { rockL: '', rockR: '', earthL: '', earthR: '', ledges: '', lips: '', drips: '', topA: '', topB: '', road: '', river: '', fall: '', fallLines: '', foam: '' };
    const faceAt = (p, q, u) => [p[0] + (q[0] - p[0]) * u, p[1] + (q[1] - p[1]) * u];
    I.tiles.forEach(([cc, rr, el]) => {
      const [cx, cy] = center(cc, rr);
      const t = 80 + eu * (el + 0.6) + rnd() * 30, e = 30;
      const Lp = [cx - a * s, cy + half * s], M = [cx, cy + tip * s], R = [cx + a * s, cy + half * s];
      const face = (p, q, y1, y2) => P([[p[0], p[1] + y1], [q[0], q[1] + y1], [q[0], q[1] + y2], [p[0], p[1] + y2]]);
      g.rockL += face(Lp, M, e, t); g.rockR += face(M, R, e, t);
      g.earthL += face(Lp, M, 0, e); g.earthR += face(M, R, 0, e);
      g.lips += face(Lp, M, 0, 9) + face(M, R, 0, 9);
      const ly = e + (t - e) * (0.35 + rnd() * 0.3);
      const ledge = (p, q, u0, u1) => { const A = faceAt(p, q, u0), B = faceAt(p, q, u1); return P([[A[0], A[1] + ly], [B[0], B[1] + ly], [B[0], B[1] + ly + 5], [A[0], A[1] + ly + 5]]); };
      g.ledges += ledge(Lp, M, 0.15, 0.6) + ledge(M, R, 0.45, 0.9);
      [[Lp, M, 0.25], [Lp, M, 0.7], [M, R, 0.35], [M, R, 0.8]].forEach(([p, q, u]) => {
        const A = faceAt(p, q, u);
        g.drips += P([[A[0] - 4, A[1] + 8], [A[0] + 4, A[1] + 8], [A[0], A[1] + 14 + rnd() * 6]]);
      });
      const top = [[cx, cy - tip * s], [cx + a * s, cy - half * s], R, M, Lp, [cx - a * s, cy - half * s]];
      for (let i = 0; i < 6; i++) {
        const tri = P([[cx, cy], top[i], top[(i + 1) % 6]]);
        if (i % 2) g.topB += tri; else g.topA += tri;
      }
    });
    const line = (list) => 'M' + list.map(([cc, rr]) => { const [x, y] = center(cc, rr); return f(x) + ' ' + f(y); }).join(' L');
    g.road = I.roads.map(line).join(' ');
    const first = I.river[0], last = I.river[I.river.length - 1];
    const [fx, fy] = center(first[0], first[1]);
    const [lx, ly] = center(last[0], last[1]);
    const lipY = ly + tip * s;
    g.river = 'M' + f(fx - a * s) + ' ' + f(fy) + ' L' + line(I.river).slice(1) + ' L' + f(lx) + ' ' + f(lipY);
    const fallLen = 150;
    g.fall = 'M' + f(lx) + ' ' + f(lipY) + 'V' + f(lipY + fallLen);
    g.fallLines = 'M' + f(lx - 6) + ' ' + f(lipY + 4) + 'V' + f(lipY + fallLen - 10) + 'M' + f(lx + 2) + ' ' + f(lipY + 16) + 'V' + f(lipY + fallLen - 4) + 'M' + f(lx + 8) + ' ' + f(lipY + 8) + 'V' + f(lipY + fallLen - 20);
    g.foam = E(lx, lipY + fallLen, 30, 9) + E(lx - 18, lipY + fallLen - 6, 10, 5) + E(lx + 20, lipY + fallLen - 4, 12, 5);
    g.rockLFill = LS > 0 ? c.rockDark : c.rockLit;
    g.rockRFill = LS > 0 ? c.rockLit : c.rockDark;
    g.earthLFill = LS > 0 ? c.earthDark : c.earthLit;
    g.earthRFill = LS > 0 ? c.earthLit : c.earthDark;

    const decos = I.decos.map(([kind, cc, rr, ddx, ddy]) => {
      const [cx, cy] = center(cc, rr);
      return { kind, x: cx + ddx, y: cy + ddy };
    }).sort((p, q) => p.y - q.y).map(({ kind, x, y }) => {
      const o = pack(kind);
      o.pw = f(o.bw * scale); o.ph = f((o.bh + o.pad) * scale);
      o.left = f((x - o.bw / 2) * scale); o.top = f((y - o.bh) * scale);
      return o;
    });
    return {
      isIsland: true, isCatalog: false, catalog: [], cols: 1, catW: 0, cellH: 0, cardBg: '',
      w: Math.round(600 * scale), h: Math.round(820 * scale),
      sx: mirror ? -1 : 1,
      dim: this.props.dim ?? 0.95,
      g, c, decos
    };
  }
}
