<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Duo-Lobby</title><style>*{box-sizing:border-box}body{margin:0;background:#14231d;color:#f3e9cf;font:17px system-ui;min-height:100vh;display:grid;place-items:center}main{width:min(560px,100%);padding:24px}button,input{font:inherit;width:100%;min-height:48px;padding:12px;border-radius:8px;border:1px solid #789780}button{background:#385f45;color:white;cursor:pointer}button:disabled{opacity:.5}input{margin:8px 0 16px;background:#f3e9cf}section{margin-top:30px}small{color:#b6c9bf}#status{min-height:48px}</style></head><body><main><h1>Zwillingsfestungen</h1><p>Erstelle eine private Duo-Lobby und lade eine zweite Person mit dem Code oder Einladungslink ein.</p><button id="create">Lobby erstellen</button><section><form id="join"><label for="code">Einladungscode</label><input id="code" maxlength="10" pattern="[A-Fa-f0-9]{10}" required autocomplete="off" autocapitalize="characters" spellcheck="false"><button>Lobby beitreten</button></form></section><p id="status" role="status"></p><small>Entwicklungsserver: aktuell auf diesem Rechner erreichbar. Zwei getrennte Tabs oder Browser nutzen. Kein Profilzugriff; Serverneustart verwirft die Partien.</small></main><script src="duo-lobby.js"></script></body></html>
