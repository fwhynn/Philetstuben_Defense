services:
  duo:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: app
    restart: unless-stopped
    environment:
      DUO_PUBLIC_ORIGIN: https://autohextd.zlyfer.net
      DUO_MAINTENANCE: '0'
    volumes:
      - duo_data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8090/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: web
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      duo:
        condition: service_healthy
volumes:
  duo_data:
  caddy_data:
  caddy_config:
