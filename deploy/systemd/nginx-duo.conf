# Add inside the existing TLS server block for autohextd.zlyfer.net.
# Keep the existing PHP-FPM handler for webhook.php.
location ^~ /socket.io/ {
    proxy_pass http://127.0.0.1:8090;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 75s;
    proxy_send_timeout 75s;
    proxy_buffering off;
}
location ~ ^/(state|command|session|results|healthz)$ {
    proxy_pass http://127.0.0.1:8090;
    proxy_set_header Host $host;
}
location ^~ /lobby/ {
    proxy_pass http://127.0.0.1:8090;
    proxy_set_header Host $host;
}
# Repository internals and deployment credentials must not be served as assets.
location ~ /\. { deny all; }
location ~ ^/(server|deploy|tests|scripts|ai|docs)/ { deny all; }
location ~ ^/(package(-lock)?\.json|webhook-error\.log|headless-core\.cjs|serve\.cjs|tag-and-push\.cjs)$ { deny all; }
